function numRound(){
  screen='brain';const lv=Math.floor(D.lvl.num||0),cf=numCfg(lv),type=cf.types[NM.round%cf.types.length];
  Object.assign(NM,{lv,cf,type,first:true,slips:0,busy:false});
  const news={count:'Mới! Đếm cùng Bé Cốm.',give:'Mới! Hái quả cho Bé Cốm. Hái xong thì bấm nút Xong rồi.',more:'Mới! So sánh hai bên.',less:'Thử thách! Lần này tìm bên ít hơn.',miss:'Mới! Dãy số bị mất một số.'}[type];
  const intro=unlockToast('num-'+type,news);
  ({count:numCount,give:numGive,more:numMore,less:numMore,miss:numMiss})[type](intro?news:'');
}
const numSay=(news,t,then)=>news?sayThen(news,t,then):say(t,then);
function numFrame(body,sayTxt){render(`${topBar(gdots(NM.rounds,NM.round))}${guide(sayTxt)}<div class="nm-wrap">${body}</div>`);wireCommon(()=>NM.say)}
function numOptions(ans,max,dots){const s=new Set([ans]);while(s.size<3){const v=clamp(ans+pickOne([-2,-1,1,2]),1,max);s.add(v);if(s.size<3&&max<4)s.add(rand(1,max))}
  return shuffle([...s]).map((n,k)=>`<button class="pick nm-pick" data-n="${n}" style="animation-delay:${(k*.1).toFixed(1)}s">${numCard(n,dots)}</button>`).join('')}
function numWin(msg){if(NM.busy)return;NM.busy=true;stat('num',true);tone('ok');bipReact('happy');confetti(50);say(msg);
  const lv=D.lvl.num||0;D.lvl.num=NM.first?lv+.5:NM.slips>=2&&lv>0?Math.max(0,lv-1):lv;save();NM.round++;dotOn(NM.round);
  if(NM.round>=NM.rounds){const st=starsFor(NM.miss);award(st);later(()=>showDone('num',st,'Đếm giỏi quá!'),2600)}else later(numRound,2700)}
function numMissTap(msg){NM.miss++;NM.slips++;NM.first=false;stat('num',false);tone('no');bipReact('sad');NM.msgP=sayW(msg,800)}
function scatter(n,set,cls=''){return Array.from({length:n},(_,i)=>`<button class="nm-it${cls}" data-i="${i}" style="--r:${rand(-12,12)}deg;--y:${rand(-10,10)}px;animation-delay:${(i*.06).toFixed(2)}s">${set.art()}<b class="nm-badge"></b></button>`).join('')}
// count: tap each one (one number per object), then pick how many there are
function numCount(news){
  const set=numSet(),n=rand(NM.lv<2?2:3,NM.cf.max);Object.assign(NM,{n,set,counted:0,say:`Đếm xem có mấy ${set.name} nào! Chạm vào từng ${set.name.split(' ')[0]} nhé.`});
  numFrame(`<div class="nm-field" id="nf">${scatter(n,set)}</div><div class="choices" id="nc"></div>`,NM.say);
  // from level 4 the child may answer without touching every one: the number cards come right after the instruction
  numSay(news,NM.say,NM.lv>=4?()=>ask():null);
  const ask=()=>{if($('#nc').innerHTML)return;NM.say=`Có tất cả mấy ${set.name}? Chọn số ở dưới nhé.`;setSay(NM.say);say(NM.say);$('#nc').innerHTML=numOptions(n,NM.cf.max,NM.cf.dots);
    $$('.nm-pick').forEach(b=>b.onclick=()=>{if(+b.dataset.n===n){b.classList.add('right');numWin(`${pickOne(PRAISE())} Có ${NUMW[n]} ${set.name}!`)}
      else{b.disabled=true;b.classList.add('nope');numMissTap('Chưa đúng. Mình đếm lại cùng nhau nhé!');recount()}})};
  const recount=async()=>{const g=gen;const its=$$('#nf .nm-it');its.forEach(x=>{x.classList.remove('on');x.querySelector('.nm-badge').textContent=''});await NM.msgP;if(g!==gen)return;
    for(let i=0;i<its.length;i++){if(g!==gen)return;its[i].classList.add('on');its[i].querySelector('.nm-badge').textContent=i+1;tone('pop');await sayW(NUMW[i+1],750)}};
  $$('#nf .nm-it').forEach(b=>b.onclick=()=>{if(b.classList.contains('on'))return;NM.counted++;b.classList.add('on');b.querySelector('.nm-badge').textContent=NM.counted;tone('pop');hush();say(NUMW[NM.counted]);
    if(NM.counted===n)later(ask,900)});
}
// give: Bé Cốm asks for a number; pick exactly that many and say "xong" (knowing when to stop = understanding the number)
function numGive(news){
  const f=pickOne(NUM_FRUIT),k=rand(NM.lv<2?2:3,Math.min(NM.cf.max,NM.lv<2?5:8)),total=Math.min(10,k+rand(2,4));const who=D.pet.hatched?D.pet.name:'Bé Cốm';Object.assign(NM,{k,f,who,taken:0,say:`${who} muốn ăn ${NUMW[k]} ${f[1]}. Hái đủ ${NUMW[k]} quả rồi bấm Xong nhé!`});
  numFrame(`<div class="nm-give"><div class="nm-tree" id="nt">${Array.from({length:total},(_,i)=>`<button class="nm-fr" data-i="${i}" style="animation-delay:${(i*.05).toFixed(2)}s">${f[0]}</button>`).join('')}</div>
      <div class="nm-side"><div class="nm-want">${numCard(k,true)}</div><div class="nm-pet">${D.pet.hatched?dino(D.pet):`<img src="${COM_SRC.dung}" alt="">`}</div>
      <div class="nm-basket" id="nb"><span class="bk">🧺</span><span class="nm-in" id="nbi"></span><b id="nbn">0</b></div><button class="big-btn go" id="ndone">✓ Xong rồi!</button></div></div>`,NM.say);numSay(news,NM.say);
  const draw=()=>{$('#nbi').textContent=f[0].repeat(NM.taken);$('#nbn').textContent=NM.taken};
  $$('#nt .nm-fr').forEach(b=>b.onclick=()=>{if(NM.busy||b.classList.contains('taken'))return;b.classList.add('taken');NM.taken++;draw();tone('pop');hush();say(NUMW[Math.min(10,NM.taken)]);restartAnim($('#nb'),'bump')});
  $('#nb').onclick=()=>{if(NM.busy||!NM.taken)return;const t=$$('#nt .nm-fr.taken').pop();t&&t.classList.remove('taken');NM.taken--;draw();tone('tap')};
  $('#ndone').onclick=()=>{if(NM.busy)return;tone('tap');
    if(NM.taken===k){numWin(`${pickOne(PRAISE())} Đủ ${NUMW[k]} ${f[1]} rồi! ${NM.who} cảm ơn ${KID()}!`);tone('munch')}
    else if(NM.taken>k)numMissTap(`Nhiều quá rồi! ${NM.who} chỉ cần ${NUMW[k]} quả thôi. Chạm vào giỏ để bỏ bớt nhé.`);
    else numMissTap(`Chưa đủ đâu! Mới có ${NUMW[NM.taken]} quả. Hái thêm nhé.`)};
}
// more / less: two groups; at higher levels the smaller group is spread wider so length does not give the answer away
function numMore(news){
  const less=NM.type==='less',set=numSet();let a=rand(1,NM.cf.max),b;do{b=rand(1,NM.cf.max)}while(Math.abs(a-b)<(NM.lv<4?2:1));
  const ans=less?(a<b?0:1):(a>b?0:1),wide=NM.lv>=3;Object.assign(NM,{say:less?`Bên nào ít ${set.name} hơn?`:`Bên nào nhiều ${set.name} hơn?`});
  const grp=(n,i,big)=>`<button class="nm-grp${big?' big':''}" data-g="${i}">${Array.from({length:n},()=>`<span class="nm-gi">${set.art()}<b class="nm-badge"></b></span>`).join('')}</button>`;
  const fewer=a<b?0:1;
  numFrame(`<div class="nm-two">${grp(a,0,wide&&fewer===0)}<span class="nm-vs">?</span>${grp(b,1,wide&&fewer===1)}</div>`,NM.say);numSay(news,NM.say+' Chạm vào bên đó nhé.');
  $$('.nm-grp').forEach(el=>el.onclick=async()=>{if(NM.busy)return;
    if(+el.dataset.g===ans){el.classList.add('right');numWin(`${pickOne(PRAISE())} Bên này có ${NUMW[[a,b][ans]]}, bên kia có ${NUMW[[a,b][1-ans]]}.`)}
    else{numMissTap('Mình đếm thử từng bên nhé!');NM.busy=true;const g=gen;await NM.msgP;
      for(const [gi,gr] of $$('.nm-grp').entries()){const its=[...gr.querySelectorAll('.nm-gi')];for(let i=0;i<its.length;i++){if(g!==gen)return;its[i].classList.add('on');its[i].querySelector('.nm-badge').textContent=i+1;tone('pop');await sayW(NUMW[i+1],650)}await wait(500)}
      if(g===gen){NM.busy=false;say(NM.say)}}})
}
// missing number on a number track
function numMiss(news){
  const len=Math.min(NM.cf.max,NM.lv<8?6:10),start=1,hole=rand(2,len);Object.assign(NM,{say:'Số nào còn thiếu? Chọn số ở dưới nhé.'});
  numFrame(`<div class="nm-track">${Array.from({length:len},(_,i)=>{const v=start+i;return `<div class="nm-step${v===hole?' hole':''}" style="animation-delay:${(i*.07).toFixed(2)}s">${v===hole?'<span class="q">?</span>':numCard(v,NM.cf.dots)}</div>`}).join('')}</div>
    <div class="choices">${numOptions(hole,len,NM.cf.dots)}</div>`,NM.say);
  const seq=Array.from({length:len},(_,i)=>start+i).map(v=>v===hole?'...':NUMW[v]).join(', ');
  numSay(news,`Cùng đọc nhé: ${seq}. ${NM.say}`);
  $$('.nm-pick').forEach(b=>b.onclick=()=>{if(+b.dataset.n===hole){b.classList.add('right');const h=$('.nm-step.hole');h.classList.remove('hole');h.innerHTML=numCard(hole,NM.cf.dots);sparkEl(h,16);numWin(`${pickOne(PRAISE())} Số ${NUMW[hole]}!`)}
    else{b.disabled=true;b.classList.add('nope');numMissTap(`Chưa đúng. Sau số ${NUMW[hole-1]} là số mấy nhỉ?`)}})
}

// ---------- Âm gì đây? (nghe âm đầu, nối âm với chữ) — trong Lâu Đài Chữ ----------
// Pictures whose word clearly starts with the letter. Letters that sound alike in southern speech (d/v/r/gi, s/x, c/k/q, l/n) never appear together as choices.
const SOUND_W={b:[['bò','🐄'],['bóng','⚽'],['bánh','🍰']],c:[['cá','🐟'],['cua','🦀'],['cây','🌳']],d:[['dê','🐐'],['dưa','🍉']],đ:[['đồng hồ','⏰'],['đèn','💡']],
  g:[['gà','🐔'],['gấu','🐻']],h:[['hoa','🌸'],['hổ','🐯']],k:[['kẹo','🍬'],['kem','🍦'],['kéo','✂️']],l:[['lá','🍃'],['lửa','🔥']],m:[['mèo','🐱'],['mũ','🧢'],['mưa','🌧️']],
  n:[['nho','🍇'],['nấm','🍄'],['nến','🕯️']],r:[['rùa','🐢'],['rắn','🐍']],s:[['sao','⭐'],['sữa','🥛'],['sư tử','🦁']],t:[['táo','🍎'],['tàu','🚂'],['tôm','🦐']],
  v:[['voi','🐘'],['vịt','🦆']],x:[['xoài','🥭'],['xe đạp','🚲']],p:[['pin','🔋']],a:[['áo','👕']],e:[['em bé','👶']],ê:[['ếch','🐸']],o:[['ong','🐝']],ô:[['ô tô','🚗']],ơ:[['ớt','🌶️']],u:[['ủng','👢']]};
const SOUND_CONF=[['c','k','q'],['d','v','r','g'],['s','x'],['l','n'],['a','ă','â'],['o','ô','ơ'],['e','ê'],['u','ư']];
const sameSound=(a,b)=>a===b||SOUND_CONF.some(g=>g.includes(a)&&g.includes(b));
const am=l=>LTR[l][0];
function soundCfg(lv){return {types:lv<2?['pick']:lv<3?['pick','pickL']:lv<5?['pickL','which','pick']:['pickL','which','odd']}}
// letters to practise: the ones the child has met first, then the rest
function soundPool(){const ab=abcData();const nextG=Math.max(0,ABC_GROUPS.findIndex((g,i)=>!ab.groups[i]));
  // plus the easiest consonant onsets, so rounds are not all vowels (o, ô, ơ) while the child is still on the first letter groups
  const met=[...ab.learned,...ABC_GROUPS.slice(0,nextG+2).flat(),'b','m','c','t','g','h','l','n'].filter(l=>SOUND_W[l]);return [...new Set(met)]}
function others(l,k,pool){const out=[];for(const x of shuffle(Object.keys(SOUND_W))){if(out.length>=k)break;if(!sameSound(x,l)&&!out.some(o=>sameSound(o,x)))out.push(x)}return out}
let SD=null;
function startSound(){SD={round:0,rounds:5,miss:0};soundRound()}
function soundRound(){
  screen='sound';const lv=Math.floor(D.lvl.sound||0),type=soundCfg(lv).types[SD.round%soundCfg(lv).types.length];
  const l=pickOne(soundPool());Object.assign(SD,{lv,type,l,first:true,slips:0,busy:false});
  const news={pick:'Mới! Âm gì đây? Nghe Bíp đọc âm, rồi tìm tranh nhé!',pickL:'Mới! Giờ có cả chữ cái. Chữ này đọc là gì nhỉ?',which:'Mới! Nghe tên con vật, đồ vật, rồi tìm chữ đầu tiên!',odd:'Thử thách! Tìm tranh có âm đầu khác các bạn!'}[type];
  const intro=unlockToast('snd-'+type,news);({pick:sdPick,pickL:sdPick,which:sdWhich,odd:sdOdd})[type](intro?news:'');
}
function sdFrame(top,choices,sayTxt){SD.say=sayTxt;render(`${topBar(gdots(SD.rounds,SD.round)+'<div class="pill">🔊 Âm gì đây?</div>')}${guide(sayTxt)}<div class="sd-wrap"><div class="sd-top">${top}</div><div class="choices sd-ch">${choices}</div></div>`);wireCommon(()=>SD.say)}
const sdPic=(w,i,extra='')=>`<button class="pick sd-pic" data-i="${i}"${extra}><span class="sd-e">${w[1]}</span><b>${w[0]}</b></button>`;
function sdWin(msg){if(SD.busy)return;SD.busy=true;stat('sound',true);tone('ok');bipReact('happy');confetti(40);say(msg);
  const lv=D.lvl.sound||0;D.lvl.sound=SD.first?lv+.5:SD.slips>=2&&lv>0?Math.max(0,lv-1):lv;save();SD.round++;dotOn(SD.round);
  if(SD.round>=SD.rounds){const st=starsFor(SD.miss);award(st);later(()=>showDone('sound',st,'Tai thính quá!'),2600)}else later(soundRound,2600)}
function sdMiss(msg){SD.miss++;SD.slips++;SD.first=false;stat('sound',false);tone('no');bipReact('sad');say(msg)}
// pick: hear a sound (and see its letter from level 2), choose the picture that starts with it
function sdPick(news){const l=SD.l,right=pickOne(SOUND_W[l]),wrong=others(l,2).map(x=>pickOne(SOUND_W[x]));const opts=shuffle([right,...wrong]);
  const showL=SD.type==='pickL';
  const top=showL?`<div class="sd-letter" style="color:${lcol(l)}">${hwSVG(l,{w:.6,pad:.3})}</div>`:`<button class="sd-ear" id="sdEar">👂<b>${'?'}</b></button>`;
  const q=`Âm ${am(l)}. ${am(l)}, ${am(l)}. Tranh nào bắt đầu bằng âm ${am(l)}?`;
  sdFrame(top,opts.map((w,i)=>sdPic(w,i)).join(''),showL?`Chữ này đọc là ${am(l)}. Tranh nào bắt đầu bằng âm ${am(l)}?`:`Tranh nào bắt đầu bằng âm ${am(l)}?`);
  const intro=`${q} Có: ${opts.map(w=>w[0]).join(', ')}.`;news?sayThen(news,intro):say(intro);SD.say=intro;
  if($('#sdEar'))$('#sdEar').onclick=()=>{tone('tap');say(q)};
  $$('.sd-pic').forEach(b=>b.onclick=()=>{if(SD.busy)return;const w=opts[+b.dataset.i];
    if(w===right){b.classList.add("right");sdWin(`${pickOne(PRAISE())} ${w[0]} bắt đầu bằng âm ${am(l)}!`)}
    else{b.classList.add('nope');setTimeout(()=>b.classList.remove('nope'),500);sdMiss(`${w[0]}... ${w[0]} bắt đầu bằng âm khác. Nghe lại nhé: âm ${am(l)}.`)}})}
// which: hear a word, choose its first letter
function sdWhich(news){const l=SD.l,w=pickOne(SOUND_W[l]),opts=shuffle([l,...others(l,2)]);
  const q=`${w[0]}. ${w[0]} bắt đầu bằng chữ nào?`;
  sdFrame(`<div class="sd-big"><span class="sd-e">${w[1]}</span></div>`,opts.map((x,i)=>`<button class="pick sd-let" data-l="${x}" style="color:${lcol(x)}">${hwSVG(x,{w:.55,pad:.3})}</button>`).join(''),`${w[0][0].toUpperCase()+w[0].slice(1)} bắt đầu bằng chữ nào?`);
  news?sayThen(news,q):say(q);SD.say=q;
  $$('.sd-let').forEach(b=>b.onclick=()=>{if(SD.busy)return;const x=b.dataset.l;
    if(x===l){b.classList.add('right');sdWin(`${pickOne(PRAISE())} ${w[0]} bắt đầu bằng chữ ${am(l)}!`)}
    else{b.classList.add('nope');setTimeout(()=>b.classList.remove('nope'),500);sdMiss(`Chữ này đọc là ${am(x)}. ${w[0]} bắt đầu bằng âm khác nhé.`)}})}
// odd one out: two pictures share the first sound, one does not
function sdOdd(news){const multi=Object.keys(SOUND_W).filter(x=>SOUND_W[x].length>=2&&soundPool().includes(x));const l=pickOne(multi.length?multi:Object.keys(SOUND_W).filter(x=>SOUND_W[x].length>=2));
  const [a,b]=shuffle(SOUND_W[l]).slice(0,2),o=others(l,1)[0],odd=pickOne(SOUND_W[o]);const opts=shuffle([a,b,odd]);
  const q=`${opts.map(w=>w[0]).join(', ')}. Tranh nào có âm đầu khác?`;
  sdFrame('<div class="sd-hint">Hai tranh có cùng âm đầu, một tranh khác.</div>',opts.map((w,i)=>sdPic(w,i)).join(''),'Tranh nào có âm đầu khác các bạn?');
  news?sayThen(news,q):say(q);SD.say=q;
  $$('.sd-pic').forEach(bt=>bt.onclick=()=>{if(SD.busy)return;const w=opts[+bt.dataset.i];
    if(w===odd){bt.classList.add('right');sdWin(`${pickOne(PRAISE())} ${a[0]} và ${b[0]} cùng âm ${am(l)}, còn ${odd[0]} là âm ${am(o)}!`)}
    else{bt.classList.add('nope');setTimeout(()=>bt.classList.remove('nope'),500);sdMiss(`${w[0]} có âm ${am(l)}, giống một bạn khác đó. Nghe lại nhé: ${q}`)}})}

// ---------- Đổi luật! (linh hoạt nhận thức: xếp theo màu rồi đổi sang xếp theo loài — dựa trên bài DCCS dùng cho trẻ 3–5 tuổi) ----------
// Every dinosaur shown matches one basket by colour and the OTHER basket by kind, so the child has to keep the current rule in mind.
function ruleCfg(lv){return lv<2?{plan:['color','color','color','color','kind','kind','kind','kind']}:lv<4?{plan:['color','color','color','kind','kind','kind','color','color','color']}
  :lv<6?{plan:['kind','kind','kind','color','color','color','kind','kind','kind','color']}:{plan:Array.from({length:10},()=>pickOne(['color','kind'])),mixed:true}}
let RL=null;
function startRule(){
  screen='brain';const lv=Math.floor(D.lvl.rule||0),cf=ruleCfg(lv);
  const [k1,k2]=shuffle(SPECIES).slice(0,2),[c1,c2]=shuffle(DCOL.filter(c=>c[0]!=='vàng')).slice(0,2);
  // baskets: left = kind1 in colour1, right = kind2 in colour2; test cards are the crossed combinations
  RL={lv,cf,bins:[{k:k1,c:c1},{k:k2,c:c2}],i:0,miss:0,rule:null,busy:false,items:cf.plan.map(r=>({r,...(Math.random()<.5?{k:k1,c:c2}:{k:k2,c:c1})}))};
  const intro=unlockToast('rule0','Mới! Trò Đổi luật. Nghe Bíp nói luật, rồi xếp bạn khủng long vào giỏ!');
  render(`${topBar(gdots(RL.items.length,0).replace('class="dots"','class="dots many"')+`<div class="pill" id="rlP"></div>`)}${guide('')}
    <div class="rl-wrap"><div class="rl-now" id="rlNow"></div>
      <div class="rl-bins">${RL.bins.map((b,i)=>`<button class="rl-bin" data-b="${i}"><span class="rl-card">${dinoArt(b.k[0],b.c[1])}</span><span class="rl-basket">🧺</span></button>`).join('')}</div></div>`);
  wireCommon(()=>RL.say);
  later(()=>ruleNext(intro?'Mới! Trò Đổi luật. Nghe Bíp nói luật, rồi xếp bạn khủng long vào giỏ!':''),300);
  $$('.rl-bin').forEach(b=>b.onclick=()=>rulePick(+b.dataset.b));
}
const ruleTxt=r=>r==='color'?'xếp theo MÀU':'xếp theo LOÀI';
const ruleIco=r=>r==='color'?'🎨 Theo màu':'🦕 Theo loài';
function ruleNext(news){
  if(RL.i>=RL.items.length)return ruleEnd();
  const it=RL.items[RL.i],changed=it.r!==RL.rule,first=RL.rule==null;RL.rule=it.r;RL.busy=false;
  $('#rlNow').innerHTML=`<div class="rl-item${RL.cf.mixed?' cue-'+it.r:''}">${dinoArt(it.k[0],it.c[1])}${RL.cf.mixed?`<b class="rl-cue">${it.r==='color'?'🎨':'🦕'}</b>`:''}</div>`;
  $('#rlP').textContent=ruleIco(it.r);
  const ex=it.r==='color'?`Bạn màu ${it.c[0]} vào giỏ có bạn màu ${it.c[0]}.`:`Bạn ${it.k[1].replace('khủng long ','')} vào giỏ có bạn ${it.k[1].replace('khủng long ','')}.`;
  let line;
  if(RL.cf.mixed)line=first?`Thử thách! Nhìn hình nhỏ trên bạn khủng long: bảng màu là xếp theo màu, khủng long là xếp theo loài.`:'';
  else if(first)line=`Luật thứ nhất: ${ruleTxt(it.r)}. ${ex}`;
  else if(changed){line=`Đổi luật! Giờ ${ruleTxt(it.r)} nhé! ${ex}`;tone('whoosh');restartAnim($('#rlP'),'bump');$('.rl-wrap').classList.add('flash');later(()=>{const w=$('.rl-wrap');w&&w.classList.remove('flash')},900)}

      <table class="lvt">${D.errLog.map(e=>`<tr><td style="white-space:nowrap">${new Date(e.t).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'})}</td><td>${e.s}</td><td class="lvd">${e.m.replace(/</g,'&lt;')}</td></tr>`).join('')}</table>
      <button class="chip" id="clrErr">Xoá danh sách lỗi</button></div>`:''}
    <div><b>Giới hạn mỗi ngày</b><div class="row" style="margin-top:8px">${[10,15,20,30].map(m=>`<button class="chip ${m===D.limit?'sel':''}" data-m="${m}">${m} phút</button>`).join('')}</div></div>
    <div><b>Giọng đọc</b> <span class="muted">(chạm để nghe thử)</span>
      <div class="row" style="margin-top:8px">${voiceChips()}</div>
      <div class="row" style="margin-top:8px">
        <button class="chip ${D.rate<1&&!D.mute?'sel':''}" data-r=".85">Chậm</button>
        <button class="chip ${D.rate>=1&&!D.mute?'sel':''}" data-r="1">Vừa</button>
        <button class="chip ${D.mute?'sel':''}" id="mute">Tắt giọng</button></div></div>
    <div><b>Hiệu ứng chuyển động</b> <span class="muted">(Giảm bớt: tắt mây trôi, pháo giấy; Bíp và các trò vẫn chuyển động bình thường)</span><div class="row" style="margin-top:8px">${[['on','Đầy đủ'],['calm','Giảm bớt']].map(([k,n])=>`<button class="chip ${(D.motion||'on')===k?'sel':''}" data-mo="${k}">${n}</button>`).join('')}</div></div>
    <div><b>Cách đọc chữ cái</b> <span class="muted">(nên theo cách cô giáo ở trường dạy)</span><div class="row" style="margin-top:8px"><button class="chip ${D.abcNames?'':'sel'}" data-an="0">Theo âm: bờ, cờ, dờ</button><button class="chip ${D.abcNames?'sel':''}" data-an="1">Theo tên: bê, xê, dê</button></div></div>
    <div class="row"><button class="chip" id="plus">+10 phút cho hôm nay</button><button class="chip" id="profs">👥 Quản lý hồ sơ</button></div>
    <div><b>Sao lưu và chuyển sang máy khác</b> <span class="muted">(tiến độ chỉ lưu trên máy này; xoá dữ liệu trình duyệt là mất)</span>
      <div class="row" style="margin-top:8px"><button class="chip" id="bk">📋 Tạo mã sao lưu</button></div>
      <textarea id="bkt" class="code" readonly hidden></textarea><p id="bkm" class="muted" style="margin:4px 0 0"></p>
      <textarea id="rst" class="code" placeholder="Dán mã sao lưu từ máy khác vào đây"></textarea>
      <div class="row" style="margin-top:6px"><button class="chip" id="rsb">♻️ Khôi phục từ mã</button></div><p id="rsm" style="margin:4px 0 0;font-weight:700"></p></div>
    <button class="big-btn" id="back" style="align-self:flex-start">Xong</button></div></div>`);
  $$('[data-m]').forEach(b=>b.onclick=()=>{D.limit=+b.dataset.m;save();showParent()});
  if($('#clrErr'))$('#clrErr').onclick=()=>{D.errLog=[];save();showParent()};
  voiceLib();
  $$('[data-lv]').forEach(b=>b.onclick=()=>{const k=b.dataset.lv;D.lvl[k]=clamp((D.lvl[k]||0)+(+b.dataset.d),0,LV_MAX[k]);save();showParent()});
  $('#plus').onclick=()=>{D.bonus+=10;save();showParent()};
  const sample=()=>say(`Chào ${KID()}! Mình là Bíp. Tìm quả trứng màu đỏ nào!`);
  $$('[data-voice]').forEach(b=>b.onclick=()=>{D.voice=b.dataset.voice;D.mute=false;save();pickVoice();showParent();sample()});
  $$('[data-r]').forEach(b=>b.onclick=()=>{D.rate=+b.dataset.r;D.mute=false;save();showParent();sample()});
  $$('[data-mo]').forEach(b=>b.onclick=()=>{D.motion=b.dataset.mo;save();applyMotion();showParent()});
  $('#mute').onclick=()=>{D.mute=true;hush();save();showParent()};
  $('#profs').onclick=()=>showStart(true);
  $$('[data-an]').forEach(b=>b.onclick=()=>{D.abcNames=b.dataset.an==='1';save();showParent();say(`Chữ ${lsay('b')}, chữ ${lsay('c')}, chữ ${lsay('d')}`)});
  $('#bk').onclick=()=>{const t=$('#bkt'),c=backupCode();t.hidden=false;t.value=c;const done=m=>{$('#bkm').textContent=m};
    try{navigator.clipboard.writeText(c).then(()=>done('Đã sao chép mã. Dán vào Ghi chú hoặc Zalo để giữ, hoặc dán vào góc bố mẹ trên máy kia.'),()=>{t.focus();t.select();done('Mã đã được chọn sẵn, bạn nhấn giữ rồi chọn Sao chép.')})}catch(e){t.focus();t.select();done('Mã đã được chọn sẵn, bạn nhấn giữ rồi chọn Sao chép.')}};
  let rsStep=0,rsObj=null;$('#rst').oninput=()=>{rsStep=0;$('#rsb').textContent='♻️ Khôi phục từ mã';$('#rsm').textContent=''};
  $('#rsb').onclick=()=>{const m=$('#rsm');
    if(!rsStep){try{rsObj=readBackup($('#rst').value)}catch(e){m.style.color='#C93A55';m.textContent='Mã chưa đúng: '+e.message+' Bạn kiểm tra đã dán đủ cả đoạn mã chưa.';return}
      rsStep=1;m.style.color='';m.textContent=`Mã có ${rsObj.profiles.length} hồ sơ: ${rsObj.profiles.map(p=>p.icon+' '+p.name).join(', ')}. Khôi phục sẽ thay toàn bộ dữ liệu trên máy này.`;$('#rsb').textContent='Chạm lần nữa để khôi phục';return}
    S=rsObj;S.data=S.data||{};S.profiles.forEach(p=>S.data[p.id]=norm(S.data[p.id]));if(!S.data[S.cur])S.cur=S.profiles[0].id;D=S.data[S.cur];save();tone('ok');showStart()};
  $('#back').onclick=leaveParent;
}
document.addEventListener('contextmenu',e=>e.preventDefault());
// if something breaks inside a game, note it for the parent page and bring the child back to the map with a friendly message
let lastCrash=0;
function onCrash(msg){try{const log=(D.errLog=D.errLog||[]);log.unshift({t:Date.now(),s:screen,m:String(msg).slice(0,160)});log.length=Math.min(log.length,10);save()}catch(e){}
  if(Date.now()-lastCrash<4000||['start','gate','parent','sleep'].includes(screen))return;lastCrash=Date.now();
  try{hush();say('Ối, Bíp bị vấp một chút. Mình về bản đồ nhé!');later(()=>{},0);setTimeout(()=>{try{showHome()}catch(e){}},1600)}catch(e){}}
addEventListener('error',e=>onCrash(e.message||'error'));
addEventListener('unhandledrejection',e=>onCrash((e.reason&&e.reason.message)||'promise'));
try{applyMotion()}catch(e){}
showStart();
</script>

<script>
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)window.__updReady=true});addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>{document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})})}).catch(()=>{}))}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
