<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#BEE7FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Xoài Phiêu Lưu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,-apple-system,sans-serif;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Xoài Phiêu Lưu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one-screen tablet app; robot guide on top, huge tap targets below, jungle hills at the bottom */
:root{
  --sky:#BEE7FF; --sky2:#E4F5FF; --leaf:#38B26A; --leaf2:#2A8F53;
  --sun:#FFC83D; --berry:#FF5C7A; --ink:#1D3646; --card:#FFFFFF; --soft:#5B7686;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky2),var(--sky) 60%);color:var(--ink);font-family:var(--body);
  overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
/* Living background: sun with turning rays, drifting clouds, a flying pterosaur, hills with a smoking volcano and palms */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco .sun{position:absolute;right:5vw;top:4vh;width:13vmin;height:13vmin}
.deco .sun::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,214,90,.45) 0 12deg,transparent 12deg 30deg);border-radius:50%;animation:spin 40s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.deco .sun::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE680,var(--sun));box-shadow:0 0 0 1.6vmin rgba(255,200,61,.3)}
@keyframes spin{to{transform:rotate(360deg)}}
.deco .cloud{position:absolute;height:5vmin;width:18vmin;border-radius:999px;background:#fff;opacity:.9;animation:drift 70s linear infinite}
.deco .cloud::before,.deco .cloud::after{content:"";position:absolute;border-radius:50%;background:#fff}
.deco .cloud::before{width:9vmin;height:9vmin;left:3vmin;top:-4.5vmin}
.deco .cloud::after{width:6vmin;height:6vmin;left:9.5vmin;top:-2.5vmin}
.deco .c1{top:13vh;left:-25vmin}.deco .c2{top:27vh;left:-25vmin;animation-delay:-28s;animation-duration:90s;scale:.7}.deco .c3{top:7vh;left:-25vmin;animation-delay:-55s;scale:.55;opacity:.7}
@keyframes drift{to{left:110vw}}
.deco .ptero{position:absolute;top:18vh;left:-14vmin;width:12vmin;animation:fly 26s linear infinite 4s}
.deco .ptero .w{transform-box:fill-box;transform-origin:50% 100%;animation:flap .5s ease-in-out infinite alternate}
@keyframes fly{0%{left:-14vmin;transform:translateY(0)}25%{transform:translateY(-4vh)}50%{transform:translateY(3vh)}75%{transform:translateY(-2vh)}60%,100%{left:110vw}}
@keyframes flap{to{transform:scaleY(-.6)}}
.deco .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:24vh}
.deco .smoke{transform-box:fill-box;transform-origin:center;animation:smoke 5s ease-out infinite;opacity:0}
.deco .smoke.s2{animation-delay:1.7s}.deco .smoke.s3{animation-delay:3.4s}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.7}100%{opacity:0;transform:translate(30px,-90px) scale(1.6)}}
.deco .palm{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
body.sleep .deco{display:none}
/* Global motion */
.screen{animation:screenIn .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes screenIn{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes popIn{from{opacity:0;transform:scale(.4)}70%{transform:scale(1.08)}}
@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes wiggle{20%{transform:rotate(-10deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
.tile,.pcard,.big-btn,.chipbtn,.num,.pick,.drag,.icon-btn,.sticker,.slot,.dpad button{transition:transform .15s cubic-bezier(.3,1.6,.5,1),box-shadow .15s}
.pick:active,.num:active,.chipbtn:active,.icon-btn:active,.sticker:active{transform:scale(.92)}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:200}
.flystar{position:fixed;z-index:210;font-size:34px;pointer-events:none;transition:transform .8s cubic-bezier(.5,-.3,.6,1),opacity .8s;will-change:transform}
.pill.bump{animation:pillBump .4s}
@keyframes pillBump{50%{transform:scale(1.3)}}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vh,18px);padding-block:clamp(10px,2vh,20px)}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;padding:0}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,64px);line-height:1;margin:0;text-wrap:balance;text-align:center}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px}
.novoice{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;width:min(92vw,620px);background:#fff;border-radius:22px;padding:14px 18px;box-shadow:0 10px 30px rgba(29,54,70,.25);display:flex;flex-direction:column;gap:6px;font-size:16px;line-height:1.4;animation:popIn .4s}
.novoice b{font-family:var(--display);font-size:19px}.novoice .chip{align-self:flex-end}
button.pill{min-height:48px}
.pill{background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;font-size:clamp(16px,2.4vw,22px);display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(29,54,70,.15);white-space:nowrap}
.icon-btn{width:clamp(48px,7vw,64px);height:clamp(48px,7vw,64px);border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:clamp(24px,3.5vw,32px);box-shadow:0 4px 0 rgba(29,54,70,.15);flex:none}
.lock{opacity:.55;font-size:20px;width:44px;height:44px}

/* Robot guide */
.guide{display:flex;align-items:center;gap:clamp(8px,2vw,20px);max-width:1000px;width:100%}
.bip{width:clamp(62px,10vw,110px);flex:none;animation:bob 2.4s ease-in-out infinite;overflow:visible;cursor:pointer}
svg .bp{transition:opacity .16s}
svg .p-talk,svg .p-happy,svg .p-sad,svg .p-walk{opacity:0}
body.talking .bip .p-idle{opacity:0}body.talking .bip .p-talk{opacity:1}
.bip.happy .bp,.bip.sad .bp{opacity:0!important}.bip.happy .p-happy,.bip.sad .p-sad{opacity:1!important}
.walk .p-idle{opacity:0}.walk .p-walk{opacity:1}
svg .bpg{transform-box:fill-box;transform-origin:50% 50%;transition:transform .2s}.flip svg .bpg{transform:scaleX(-1)}
@keyframes bob{50%{transform:translateY(-6px)}}
svg .b-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
svg .b-pupil{animation:look 7s ease-in-out infinite}
@keyframes look{0%,40%,100%{transform:translate(0,0)}50%,65%{transform:translate(-4px,1px)}75%,90%{transform:translate(3px,-1px)}}
svg .b-ant{animation:antGlow 1.6s ease-in-out infinite alternate}
@keyframes antGlow{to{fill:#FFF3B0}}
svg .b-mouth{transform-box:fill-box;transform-origin:50% 0}
body.talking .bip .b-mouth{animation:talk .18s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(1.5)}}
svg .b-arm{transform-box:fill-box}
svg .b-armL{transform-origin:100% 50%}svg .b-armR{transform-origin:0% 50%}
.bip.happy{animation:bipHappy .85s ease}
.bip.happy .b-armL{animation:waveL .2s 4 alternate}.bip.happy .b-armR{animation:waveR .2s 4 alternate}
@keyframes bipHappy{30%{transform:translateY(-22px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg) scale(1.05,.95)}}
@keyframes waveL{to{transform:rotate(40deg)}}@keyframes waveR{to{transform:rotate(-40deg)}}
.bip.sad{animation:bipSad .85s ease}
@keyframes bipSad{30%,70%{transform:rotate(-12deg) translateY(4px)}}
.bubble.pop{animation:bubPop .35s}
@keyframes bubPop{40%{transform:scale(1.04)}}
.bubble{flex:1;min-width:0;background:var(--card);border-radius:26px;padding:clamp(10px,1.6vh,18px) clamp(14px,2.4vw,26px);font-family:var(--display);font-weight:800;
  font-size:clamp(20px,3.2vw,36px);line-height:1.15;position:relative;box-shadow:0 5px 0 rgba(29,54,70,.15);display:flex;align-items:center;gap:12px}
.bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:16px solid var(--card);border-left:0}
.bubble span{flex:1;min-width:0}
.bubble .icon-btn{box-shadow:none;background:var(--sky2)}
.inl{display:inline-block;width:.8em;height:1em;vertical-align:-.12em}

/* Home */
.tiles{flex:1;min-height:0;width:100%;max-width:1040px;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,2vw,22px);align-content:center}
.tile{border-radius:30px;padding:clamp(12px,2vh,22px) 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 8px 0 rgba(29,54,70,.22);transition:transform .12s;min-height:clamp(150px,30vh,300px);position:relative}
.tile:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(29,54,70,.22)}
.tile .art{height:clamp(64px,13vh,130px);display:flex;align-items:center;justify-content:center;font-size:clamp(50px,9vh,92px);line-height:1}
.tile .art svg{height:100%;width:auto}
.tile b{font-family:var(--display);font-size:clamp(19px,2.6vw,30px);line-height:1.05;text-align:center}
.tile small{position:absolute;top:10px;left:12px;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.7);border-radius:999px;padding:3px 10px}
.t1{background:linear-gradient(160deg,#A8E6BC,#7ACF96)}.t2{background:linear-gradient(160deg,#FFC6D3,#FF9DB4)}.t3{background:linear-gradient(160deg,#FFDC73,#FFBE2E)}.t4{background:linear-gradient(160deg,#CBE6FF,#9CCBFF)}
.tile{overflow:hidden;animation:popIn .55s backwards}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:shine 6s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,70%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.tiles>.tile:nth-child(2){animation-delay:.08s}.tiles>.tile:nth-child(2)::after{animation-delay:1.5s}
.tiles>.tile:nth-child(3){animation-delay:.16s}.tiles>.tile:nth-child(3)::after{animation-delay:3s}
.tiles>.tile:nth-child(4){animation-delay:.24s}.tiles>.tile:nth-child(4)::after{animation-delay:4.5s}
.tile .art{animation:float 3.2s ease-in-out infinite}
.tiles>.tile:nth-child(2) .art{animation-delay:-.8s}.tiles>.tile:nth-child(3) .art{animation-delay:-1.6s}.tiles>.tile:nth-child(4) .art{animation-delay:-2.4s}
.tile:hover .art{animation:wiggle .6s}
.quick>*,.bottom>*{animation:popIn .45s .3s backwards}
.pgrid>.pcard{animation:popIn .5s backwards}
.pgrid>.pcard:nth-child(2){animation-delay:.07s}.pgrid>.pcard:nth-child(3){animation-delay:.14s}.pgrid>.pcard:nth-child(4){animation-delay:.21s}.pgrid>.pcard:nth-child(5){animation-delay:.28s}
.pcard .pic{animation:float 3s ease-in-out infinite}
.guide{animation:popIn .45s backwards}
.quick{width:100%;max-width:1040px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.quick span{font-weight:800;color:var(--soft)}
.chipbtn{background:var(--card);border-radius:999px;padding:10px 20px;min-height:52px;font-weight:800;font-size:clamp(17px,2.3vw,21px);box-shadow:0 4px 0 rgba(29,54,70,.15)}
.bottom{width:100%;max-width:1040px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.big-btn{background:var(--berry);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.2vw,32px);border-radius:999px;padding:10px 30px;box-shadow:0 6px 0 #C93A55}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #C93A55}
.big-btn.alt{background:var(--card);color:var(--ink);box-shadow:0 6px 0 rgba(29,54,70,.2)}
.big-btn.go{background:var(--leaf);box-shadow:0 6px 0 var(--leaf2)}
.timebar{flex:1;min-width:160px;height:22px;border-radius:999px;background:rgba(255,255,255,.7);overflow:hidden}
.timebar i{display:block;height:100%;background:var(--leaf);border-radius:999px;transition:width .5s}

/* Adventure map */
.map-holder{flex:1;min-height:0;width:100%;display:grid;place-items:center}
@media (orientation:portrait){.map-holder{overflow:hidden;flex:none;padding-block:10px;display:flex;align-items:center;justify-content:flex-start}.map-holder .map{flex:none}.map{border-radius:0;box-shadow:none}}
.home-tasks{display:none}
@media (orientation:portrait){.home-tasks{display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px;flex:1;min-height:0;justify-content:center}
  .home-tasks .ht-t{font:800 clamp(20px,3.2vw,28px) var(--display);text-align:center}
  .home-tasks .mrow{background:var(--card);border-radius:22px;box-shadow:0 5px 0 rgba(29,54,70,.14);min-height:72px}}
.map{position:relative;border-radius:30px;overflow:hidden;box-shadow:0 0 0 6px #fff,0 14px 0 6px rgba(29,54,70,.16);--mh:500px;animation:popIn .5s backwards}
.map>svg.mapbg{position:absolute;inset:0;width:100%;height:100%}
.map .waves path{animation:waves 5s linear infinite}
@keyframes waves{to{transform:translateX(-120px)}}
.map .trail{stroke-dasharray:2 26;animation:trail 2.2s linear infinite}
@keyframes trail{to{stroke-dashoffset:-56}}
.map .palm,.deco .palm{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
.map .smoke{transform-box:fill-box;transform-origin:center;animation:smoke 5s ease-out infinite;opacity:0}
.map .smoke.s2{animation-delay:1.7s}.map .smoke.s3{animation-delay:3.4s}
.map .boat>g{animation:boat 3s ease-in-out infinite}
@keyframes boat{50%{transform:translateY(-6px) rotate(-4deg)}}
.map .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3s ease-out infinite}
@keyframes ripple{from{transform:scale(.4);opacity:1}to{transform:scale(2);opacity:0}}
.station{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--mh)*.008);width:calc(var(--mh)*.3);z-index:2;animation:stIn .55s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:var(--d)}
@keyframes stIn{from{transform:translate(-50%,-50%) scale(0)}}
.st-ring{width:calc(var(--mh)*.19);height:calc(var(--mh)*.19);border-radius:50%;display:grid;place-items:center;border:calc(var(--mh)*.012) solid #fff;box-shadow:0 calc(var(--mh)*.014) 0 rgba(29,54,70,.28);animation:stBob 3s ease-in-out infinite;overflow:hidden}
.st-ring svg{width:76%;height:76%;overflow:visible}
.st-name{position:relative;z-index:2}
.station:not(.pic) .st-ring{width:calc(var(--mh)*.16);height:calc(var(--mh)*.16)}
.mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
.st-img{width:80%;height:80%;object-fit:contain}
.station.pic .st-ring{width:calc(var(--mh)*.2);height:calc(var(--mh)*.165);background:none!important;border:0;border-radius:0;box-shadow:none;overflow:visible}
.station.pic .st-img{width:100%;height:100%;filter:drop-shadow(0 calc(var(--mh)*.012) 0 rgba(29,54,70,.22))}
.station.pic.mtask .st-ring{box-shadow:none}.station.pic.mtask .st-img{filter:drop-shadow(0 0 calc(var(--mh)*.012) #FFC83D) drop-shadow(0 0 calc(var(--mh)*.03) #FFE28A)}
@keyframes stBob{50%{transform:translateY(calc(var(--mh)*-.012))}}
.station.go .st-ring{animation:stGo .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes stGo{40%{transform:scale(.85)}70%{transform:scale(1.12)}}
.st-name{background:#fff;border-radius:999px;padding:.12em .7em;font-family:var(--display);font-weight:800;font-size:clamp(12px,calc(var(--mh)*.042),24px);white-space:nowrap;box-shadow:0 3px 0 rgba(29,54,70,.15);line-height:1.3}
.st-badge{position:absolute;top:-2%;right:10%;background:var(--berry);color:#fff;border-radius:999px;font-weight:800;font-size:clamp(11px,calc(var(--mh)*.032),18px);padding:.1em .6em;box-shadow:0 3px 0 rgba(29,54,70,.2);white-space:nowrap}
.st-badge.alert{background:#FF8A3D;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.mapbip{position:absolute;width:calc(var(--mh)*.11);transform:translate(-50%,-100%);transition:left .9s cubic-bezier(.5,0,.4,1),top .9s cubic-bezier(.5,0,.4,1);z-index:3;pointer-events:none;filter:drop-shadow(0 4px 0 rgba(29,54,70,.25))}
.mapbip svg{width:100%;height:auto;animation:bob 2.4s ease-in-out infinite}
.mapbip.walk svg{animation:walk .18s ease-in-out infinite alternate}
.map-time{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px;width:min(46%,320px);box-shadow:0 4px 0 rgba(29,54,70,.15);z-index:2}
.map-time .timebar{min-width:0;height:16px;background:#E4F0F5}
.sheet-wrap{position:absolute;inset:0;background:rgba(29,54,70,.35);display:grid;place-items:center;z-index:6;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.sheet{background:#fff;border-radius:30px;padding:clamp(14px,3vh,26px);display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:92%;animation:popIn .45s cubic-bezier(.3,1.5,.5,1)}
.sheet-t{width:100%;text-align:center;font-family:var(--display);font-size:clamp(22px,3vw,30px)}
.sheet button{background:var(--sky2);border-radius:24px;padding:12px;width:clamp(120px,18vw,170px);display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:clamp(16px,2vw,20px);box-shadow:0 6px 0 rgba(29,54,70,.15);transition:transform .15s}
.sheet button:active{transform:scale(.93)}
.sheet.brain6{display:grid;grid-template-columns:repeat(3,auto);max-width:min(92%,640px)}.sheet.brain6 .sheet-t{grid-column:1/-1}@media (min-width:1000px) and (orientation:landscape){.sheet.brain6{grid-template-columns:repeat(6,auto);max-width:96%}}
.sheet button span{height:clamp(70px,11vw,100px);display:grid;place-items:center}
.sheet button svg{height:100%;width:auto;max-width:100%}

/* Pet wandering on the map */
.mappet{position:absolute;width:calc(var(--mh)*.17);transform:translate(-50%,-100%);transition-property:left,top;transition-timing-function:linear;z-index:2;filter:drop-shadow(0 3px 0 rgba(29,54,70,.18))}
.mappet svg{width:100%;height:auto;overflow:visible;transition:transform .3s}
.mappet.flip svg{transform:scaleX(-1)}
.mappet.walk .dino{animation:walk .28s ease-in-out infinite alternate}
.mappet.hop .dino{animation:jump .7s ease}
/* Dino band */
.band-stage{flex:1;min-height:0;width:100%;max-width:1040px;border-radius:30px;position:relative;overflow:hidden;box-sizing:border-box;padding:3% 4% 2%;
  background:radial-gradient(ellipse at 50% -10%,#7A6CD6,#3A2F7A 60%,#251E52);box-shadow:0 10px 0 rgba(29,54,70,.18)}
.band-stage::before,.band-stage::after{content:"";position:absolute;top:0;bottom:0;width:7%;background:repeating-linear-gradient(90deg,#D63A5A 0 10px,#B82748 10px 20px);z-index:0}
.band-stage::before{left:0;border-radius:0 0 40% 0}.band-stage::after{right:0;border-radius:0 0 0 40%}
.band-row{position:relative;z-index:1;display:flex;gap:2%;width:100%;height:100%;justify-content:center;align-items:flex-end}
.bpad{flex:1;max-width:21%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;animation:popIn .5s backwards}
.bpad svg{width:100%;height:auto;max-height:62%;position:relative;z-index:2;transition:transform .15s cubic-bezier(.3,1.8,.5,1),filter .3s}
.bpad .podium{width:96%;height:14%;min-height:18px;border-radius:50%;background:var(--c);border:4px solid #1D3646;margin-top:-6%;position:relative;z-index:1;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.bpad .light{position:absolute;left:-20%;right:-20%;top:0;bottom:4%;background:linear-gradient(to bottom,rgba(255,244,190,0),rgba(255,244,190,.55));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);opacity:0;transition:opacity .12s;z-index:0;pointer-events:none}
.bpad.sing .light{opacity:1}
.bpad.sing svg{transform:translateY(-14%) scale(1.1) rotate(-4deg)}
.bpad.sing .podium{filter:brightness(1.3)}
.bpad .simg{opacity:0}.bpad.sing .simg{opacity:1}.bpad.sing .nimg{opacity:0}
.bpad.dim svg{filter:saturate(.7) brightness(.85)}
.bpad:active svg{transform:scale(.92)}
.note-fx{position:absolute;top:20%;z-index:3;color:#FFE28A;font-size:clamp(28px,5vw,48px);font-weight:800;pointer-events:none;animation:noteUp 1.2s ease-out forwards;text-shadow:0 2px 0 #1D3646}
@keyframes noteUp{to{transform:translateY(-90px) rotate(20deg);opacity:0}}
.band-ctl{justify-content:center}

/* Alphabet castle */
.grp-grid{flex:1;min-height:0;width:100%;max-width:1040px;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.6vw,16px);align-content:center}
.grp{background:#fff;border-radius:24px;padding:clamp(8px,1.6vh,16px) 6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(29,54,70,.16);border:4px solid transparent;animation:popIn .45s backwards;transition:transform .15s}
.grp:active{transform:scale(.93)}
.grp .gl svg{height:1.25em;width:auto}
.grp .gl{display:flex;gap:.15em;align-items:center;font-family:Nunito,var(--display);font-weight:800;font-size:clamp(28px,4.6vw,48px);line-height:1.15;color:var(--c)}
.grp .gs{color:#FFB800;font-size:clamp(14px,2vw,20px);letter-spacing:2px}.grp .gs em{color:#DCE6EC;font-style:normal}
.grp.next{border-color:var(--c);animation:popIn .45s backwards,nextPulse 1.6s ease-in-out .6s infinite}
@keyframes nextPulse{50%{transform:scale(1.05);box-shadow:0 6px 0 rgba(29,54,70,.16),0 0 0 8px rgba(255,200,61,.35)}}
.abc-learn{flex:1;min-height:0;width:100%;max-width:1040px;display:flex;gap:clamp(12px,3vw,32px);align-items:center;justify-content:center}
.abc-big{flex:1;max-width:46%;height:100%;max-height:100%;background:#fff;border-radius:34px;box-shadow:0 8px 0 rgba(29,54,70,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;
  background-image:linear-gradient(rgba(120,170,220,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,220,.18) 1px,transparent 1px);background-size:28px 28px}
.abc-big>svg{height:78%;width:auto;max-width:92%;color:var(--c);overflow:visible}
.hw .oli line{stroke:#CFE0EE;stroke-width:.04}.hw .oli line.base{stroke:#FF9DB0;stroke-width:.07}.hw .oli line.mid{stroke:#9CC3E6;stroke-width:.06}
.hw.write polyline{stroke-dasharray:1;stroke-dashoffset:1;animation:penWrite 1.1s ease-in-out forwards;animation-delay:calc(var(--i) * 1.15s + .2s)}
@keyframes penWrite{to{stroke-dashoffset:0}}
.abc-big .lc{font-family:Nunito,var(--display);font-weight:800;font-size:clamp(120px,min(30vw,40vh),300px);line-height:1;color:var(--c);text-shadow:0 6px 0 rgba(29,54,70,.15);animation:float 3s ease-in-out infinite;display:inline-block}
.abc-big .uc{font-family:Nunito,var(--display);font-weight:800;font-size:clamp(20px,3vw,32px);color:var(--soft)}
.abc-big.wig .lc{animation:wiggle .6s}
.abc-side{flex:1;max-width:46%;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.abc-pic{background:#fff;border-radius:30px;padding:clamp(12px,2.4vh,24px);box-shadow:0 8px 0 rgba(29,54,70,.16);display:flex;flex-direction:column;align-items:center;gap:6px;animation:popIn .5s .2s backwards}
.abc-pic .emo{font-size:clamp(70px,min(14vw,20vh),150px);line-height:1;display:inline-block}
.abc-pic .emo.wig{animation:wiggle .6s}
.abc-pic .word{font-family:Nunito,var(--display);font-size:clamp(30px,5vw,52px);line-height:1.1}
.abc-pic .word i{font-style:normal;text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:6px}
.abc-desc{margin:0;background:rgba(255,255,255,.75);border-radius:20px;padding:12px 16px;font-size:clamp(17px,2.2vw,22px);font-weight:700;line-height:1.35}
@media (orientation:portrait),(max-width:700px){.abc-learn{flex-direction:column}.abc-big,.abc-side{max-width:100%;width:100%}.abc-big{flex:1}.abc-side{flex:none}.abc-big .lc{font-size:clamp(100px,24vh,220px)}.abc-pic{flex-direction:row;justify-content:center;gap:16px}.abc-pic .emo{font-size:clamp(56px,10vh,90px)}}
.trace-wrap{flex:1;min-height:0;width:100%;max-width:1040px;position:relative;border-radius:30px;overflow:hidden;box-shadow:0 0 0 6px #fff,0 12px 0 6px rgba(29,54,70,.14);touch-action:none;background:#FFFDF6}
.trace-wrap canvas{display:block;touch-action:none;cursor:crosshair}
.trace-meter{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(40%,260px);height:14px;border-radius:999px;background:#E4F0F5;overflow:hidden;box-shadow:inset 0 0 0 2px #fff}
.trace-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFC83D,#38B26A);border-radius:999px;transition:width .2s}
.find-stage{flex:1;min-height:0;width:100%;max-width:1040px;position:relative;border-radius:30px;overflow:hidden;background:linear-gradient(#DFF4FF,#BEE7FF);box-shadow:0 10px 0 rgba(29,54,70,.14)}
.bubl svg{width:62%;height:62%;overflow:visible}
.inlhw{display:inline-block;vertical-align:middle}.inlhw svg{height:1.6em;width:auto;display:block}
.stroke-chips{position:absolute;left:12px;top:12px;display:flex;gap:6px}
.sci{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid #DDE8EE;display:grid;place-items:center;font-weight:800;color:#9FB3C2}
.sci.cur{border-color:#38B26A;color:#38B26A;animation:pulse 1s infinite}.sci.ok{background:#38B26A;border-color:#38B26A;color:#fff}
.bubl{position:absolute;bottom:0;transform:translateY(100%);border-radius:50%;display:grid;place-items:center;color:var(--c);line-height:1;
  background:radial-gradient(circle at 30% 28%,#fff 0 14%,rgba(255,255,255,.85) 15%,rgba(255,255,255,.55) 60%,rgba(190,231,255,.5));border:4px solid rgba(255,255,255,.95);box-shadow:inset 0 -6px 12px rgba(47,125,246,.15),0 4px 10px rgba(29,54,70,.12);
  animation-name:rise,sway2;animation-timing-function:linear,ease-in-out;animation-iteration-count:1,infinite;animation-direction:normal,alternate;animation-fill-mode:forwards,none}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(calc(-1 * var(--h)))}}
@keyframes sway2{from{margin-left:-14px}to{margin-left:14px}}
.bubl.popd{animation:bubPopX .35s forwards!important;margin-left:0}
@keyframes bubPopX{to{scale:1.6;opacity:0}}
.bubl.nope{outline:4px solid #FF5C7A}
.fcount{font-size:.7em;color:var(--soft);margin-left:.3em}
.lboard{flex:1;min-height:0;overflow:auto;width:100%;max-width:1040px;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(76px,10vw,110px),1fr));gap:10px;align-content:start;padding:4px}
.ltile{aspect-ratio:1;max-width:100%;border-radius:22px;background:rgba(255,255,255,.55);display:grid;place-items:center;position:relative;animation:popIn .4s backwards;transition:transform .15s}
.ltile span{color:#B9CBD6;height:86%;display:grid;place-items:center}.ltile span svg{height:100%;width:auto}
.ltile.on{background:#fff;box-shadow:0 5px 0 rgba(29,54,70,.15)}.ltile.on span{color:var(--c)}
.ltile em{position:absolute;right:6px;bottom:4px;font-style:normal;font-size:clamp(16px,2vw,22px)}
.ltile.wig{animation:wiggle .6s}

/* Vườn Tư Duy */
.se2{font-size:clamp(46px,7vw,64px);line-height:1}
.meadow{flex:1;min-height:0;width:100%;max-width:1040px;position:relative;border-radius:30px;overflow:hidden;background:linear-gradient(#D8F1FF,#F0FAFF 58%,#9EDB8C 58.3%,#7FCB6E);box-shadow:0 10px 0 rgba(29,54,70,.14)}
.meadow .sunbeam{position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(255,226,120,.55),transparent 40%);pointer-events:none}
.lineup{position:absolute;left:3%;right:3%;bottom:10%;height:62%;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2%;align-items:end}
.slot2{height:100%;display:flex;align-items:flex-end;justify-content:center;animation:popIn .5s backwards;border-radius:20px;position:relative}
.slot2 svg{width:100%;max-height:100%;height:auto}
.slot2.empty{border:4px dashed rgba(255,255,255,.95);background:rgba(255,255,255,.35);align-items:center}
.slot2 .q{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,90px);color:#fff;text-shadow:0 4px 0 rgba(29,54,70,.25);animation:pulse 1s infinite}
.slot2.back{animation:hopIn .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes hopIn{from{transform:translateY(60%) scale(.4);opacity:0}}
.slot2.blink{animation:blinkHi 1.2s}
.slot2.tapme{cursor:pointer;animation:float 2.4s ease-in-out infinite}
@keyframes blinkHi{0%,40%,80%{background:rgba(255,224,138,.9)}20%,60%,100%{background:transparent}}
.bushes{position:absolute;left:-4%;right:-4%;bottom:0;height:93%;z-index:3;transform:translateY(112%);transition:transform .5s cubic-bezier(.4,1.35,.5,1);pointer-events:none}
.meadow.cover .bushes{transform:translateY(0)}
.bushes .hedge{position:absolute;inset:0;width:100%;height:100%;display:block}
.bushes i{position:absolute;font-style:normal;font-size:clamp(22px,4vw,40px);z-index:2}
.hide-count{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,72px);color:var(--berry);text-shadow:0 4px 0 #fff;z-index:4}
.hide-count.tick{animation:popIn .5s}
.hchoices .pick svg{width:100%;height:auto}
.mk-wrap{flex:1;min-height:0;width:100%;max-width:1040px;position:relative;display:flex;flex-direction:column;gap:12px}
.mk-req{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:3%;border-radius:30px;background:linear-gradient(#FFF7E8,#FFE6F0);box-shadow:0 10px 0 rgba(29,54,70,.12);padding:3%}
.mk-pet{flex:0 0 34%;align-self:stretch;position:relative;min-height:0}.mk-pet svg{position:absolute;inset:0;width:100%;height:100%}
.mk-cloud{flex:1;min-height:40%;background:#fff;border-radius:40px;box-shadow:0 6px 0 rgba(29,54,70,.12);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4%;padding:3%;position:relative;transition:opacity .5s,transform .5s}
.mk-cloud::before{content:"";position:absolute;left:-18px;top:50%;border:14px solid transparent;border-right:20px solid #fff;border-left:0;transform:translateY(-50%)}
.mk-cloud.fade{opacity:0;transform:scale(.85)}
.mki{display:flex;flex-direction:column;align-items:center;font-size:clamp(54px,9vw,100px);line-height:1.05;animation:popIn .5s cubic-bezier(.3,1.7,.5,1)}
.mki b{font-family:var(--display);font-size:clamp(17px,2.4vw,24px)}
.mk-market{flex:1;min-height:0;border-radius:30px;background:#FFF;box-shadow:0 10px 0 rgba(29,54,70,.12);overflow:hidden;display:flex;flex-direction:column}
.awning{height:clamp(28px,5vh,44px);background:repeating-linear-gradient(90deg,#FF5C7A 0 40px,#fff 40px 80px);border-bottom:4px solid #1D3646;
  -webkit-mask:radial-gradient(circle at 20px 100%,transparent 12px,#000 13px) 0 0/40px 100%;mask:radial-gradient(circle at 20px 100%,transparent 12px,#000 13px) 0 0/40px 100%}
.mk-stall{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(74px,11vw,110px),1fr));gap:10px;align-content:center;padding:12px;background:linear-gradient(#FFF,#FFF3D9)}
.mkitem{aspect-ratio:1;max-width:100%;border-radius:22px;background:#fff;box-shadow:0 5px 0 rgba(29,54,70,.15);font-size:clamp(40px,7vw,64px);animation:popIn .4s backwards;transition:transform .3s,opacity .3s}
.mkitem.taken{transform:translateY(60px) scale(.3);opacity:0;pointer-events:none}
.mkitem.bump{animation:pickBump .35s ease}@keyframes pickBump{50%{transform:scale(.82)}}
.mkq{display:flex;gap:2px;font-size:.78em}
.mkitem.nope{animation:shake .45s}
.mk-basket{position:absolute;right:2%;bottom:-2%;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 16px;box-shadow:0 6px 0 rgba(29,54,70,.15);z-index:3}
.mk-basket .bk{font-size:clamp(36px,6vw,52px)}
.mk-basket .bi{display:flex;gap:6px}.mk-basket .bi i{width:clamp(36px,5vw,48px);height:clamp(36px,5vw,48px);border-radius:50%;border:3px dashed #CFDDE6;display:grid;place-items:center;font-style:normal;font-size:clamp(24px,3.6vw,34px)}
.mk-basket .bi i.in{border:3px solid #38B26A;background:#E8FBEF;animation:popIn .4s}
.mk-basket.bump{animation:pillBump .4s}
.pt-track{flex:1;min-height:0;width:100%;max-width:1040px;display:grid;place-items:center;border-radius:30px;background:linear-gradient(#EAF6FF,#D8EEFF);box-shadow:0 10px 0 rgba(29,54,70,.12);padding:2%;box-sizing:border-box;
  background-image:linear-gradient(transparent 62%,rgba(255,255,255,.7) 62% 66%,transparent 66%)}
.pt-row{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1.2%;width:100%;align-items:center}
.pt-cell{aspect-ratio:1;max-width:100%;border-radius:18px;background:#fff;box-shadow:0 5px 0 rgba(29,54,70,.12);display:grid;place-items:center;padding:8%;box-sizing:border-box;animation:popIn .4s backwards}
.pt-cell svg{width:100%;height:100%}
.pt-cell.hole{border:4px dashed #9FB3C2;background:rgba(255,255,255,.5);box-shadow:none}
.pt-cell.hole.cur{border-color:var(--berry);background:#FFF0F4}
.pt-cell .q{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,56px);color:#9FB3C2;animation:pulse 1s infinite}
.pt-cell.beat{animation:beat .35s}
@keyframes beat{40%{transform:translateY(-16%) scale(1.08)}}
.pt-cell.filled{background:#E8FBEF;box-shadow:0 0 0 4px #38B26A}
.ptpick svg{width:100%;height:100%}
.sy-wrap{flex:1;min-height:0;width:100%;max-width:1040px;display:flex;flex-direction:column;gap:clamp(10px,2vh,20px)}
.sy-slots{flex:1.1;min-height:0;display:flex;align-items:stretch;justify-content:center;gap:1.5%;background:linear-gradient(#FFF7E8,#FFEFD2);border-radius:30px;padding:2%;box-shadow:0 10px 0 rgba(29,54,70,.12)}
.sy-arrow{align-self:center;font-size:clamp(22px,3.4vw,36px);color:#D99A57;font-weight:800}
.sy-slot{flex:1;max-width:26%;border-radius:22px;border:4px dashed #D9B98A;background:rgba(255,255,255,.6);position:relative;display:grid;place-items:center;overflow:hidden}
.sy-slot em{position:absolute;top:6px;left:8px;width:30px;height:30px;border-radius:50%;background:#D99A57;color:#fff;font-style:normal;font-weight:800;display:grid;place-items:center;z-index:2}
.sy-slot.full{border:4px solid #fff;background:#fff;box-shadow:0 6px 0 rgba(29,54,70,.14)}
.sy-slot.locked{border-color:#38B26A}.sy-slot.locked em{background:#38B26A}
.sy-slot.tell{animation:pillBump .6s;box-shadow:0 0 0 6px #FFC83D}
.sy-slot.nope{animation:shake .45s}
.sy-in,.sy-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:100%;position:relative}
.sy-in svg,.sy-card svg{width:86%;max-height:72%;height:auto}
.sy-img{width:92%;flex:1 1 0;min-height:0;max-height:74%;object-fit:contain;pointer-events:none;margin-top:8%}
.sy-in .se,.sy-card .se{font-size:clamp(44px,8vw,88px);line-height:1}
.se.launch{display:inline-block;animation:float 1.6s ease-in-out infinite;transform:rotate(-30deg)}
.sy-in .ov,.sy-card .ov{position:absolute;top:8%;right:10%;font-size:clamp(24px,4vw,40px)}
.sy-in b,.sy-card b{font-family:var(--display);font-size:clamp(13px,1.8vw,18px);line-height:1.1;text-align:center;padding:0 4px}
.sy-pool{flex:1;min-height:0;display:flex;gap:2%;justify-content:center;align-items:stretch}
.sy-card{flex:1;max-width:24%;border-radius:22px;background:#fff;box-shadow:0 6px 0 rgba(29,54,70,.15);animation:popIn .45s backwards;transition:opacity .25s,transform .25s}
.sy-card{position:relative}.sy-card.tell{box-shadow:0 0 0 6px #FFC83D,0 6px 0 rgba(29,54,70,.15);transform:translateY(-6px) scale(1.04)}
.sy-ear{position:absolute;top:6px;right:6px;width:clamp(30px,4vw,40px);height:clamp(30px,4vw,40px);border-radius:50%;background:#FFF4D6;box-shadow:0 2px 0 rgba(29,54,70,.18);display:grid;place-items:center;font-style:normal;font-size:clamp(15px,2vw,20px)}
.sy-card.used{opacity:.2;transform:scale(.9);pointer-events:none}
.sy-card.right{box-shadow:0 0 0 6px #38B26A,0 6px 0 rgba(29,54,70,.15)}
.sy-slot .sy-q{font:800 clamp(44px,7vw,80px) var(--display);color:#D99A57;animation:pulse 1s infinite}
.sy-slot.qslot{border-color:var(--berry)}
.sy-slots.why{align-items:center;gap:4%}.sy-slot.wbig{max-width:34%;height:100%}.sy-slot.wbig .se{font-size:clamp(56px,10vw,110px)}
.why-q{font:800 clamp(34px,6vw,64px) var(--display);color:var(--berry);animation:pulse 1.4s infinite}
.sy-act{flex:1;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
.sy-mic{font:800 clamp(20px,3vw,28px) var(--display);padding:12px 22px;border-radius:999px;background:#fff;box-shadow:0 4px 0 rgba(29,54,70,.15)}
.sy-mic.on{color:#C93A55;animation:pulse 1.2s infinite}.sy-mic.play{color:var(--leaf2);animation:pulse 1.2s infinite}

/* Daily missions */
.pill.mis{background:#FFF3C4}
.pill.mis.ready{background:var(--sun);animation:pulse 1s ease-in-out infinite}
.station.mtask .st-ring{box-shadow:0 calc(var(--mh)*.014) 0 rgba(29,54,70,.28),0 0 0 calc(var(--mh)*.012) #FFC83D,0 0 calc(var(--mh)*.06) #FFE28A}
.station.mtask::after{content:"!";position:absolute;top:-4%;left:12%;width:calc(var(--mh)*.06);height:calc(var(--mh)*.06);min-width:22px;min-height:22px;border-radius:50%;background:var(--sun);color:var(--ink);font-weight:800;display:grid;place-items:center;border:3px solid #fff;font-size:clamp(12px,calc(var(--mh)*.035),20px);animation:pulse 1.2s ease-in-out infinite}
.sheet.mission{flex-direction:column;align-items:stretch;width:min(520px,92%);gap:10px}
.mrow{display:flex!important;flex-direction:row!important;align-items:center;gap:14px!important;width:100%!important;padding:10px 14px!important;text-align:left;font-size:clamp(17px,2.2vw,22px)!important}
.mrow .mic{width:clamp(48px,7vw,64px);height:clamp(48px,7vw,64px);border-radius:50%;display:grid;place-items:center;flex:none;border:3px solid #fff;overflow:hidden}
.mrow .mic svg{width:78%;height:78%}
.mrow .mtx{flex:1;min-width:0}.mrow .mck{font-size:1.3em}
.mrow.done{opacity:.65}.mrow.done .mtx{text-decoration:line-through;text-decoration-thickness:3px}
.mbanner{background:#E8FBEF;border:3px solid #38B26A;border-radius:20px;padding:10px 18px;font-weight:800;font-size:clamp(16px,2.2vw,22px);animation:popIn .5s 1s backwards}
.mbanner span{color:var(--soft);font-size:.85em;margin-left:.4em}
/* Shop */
.shop{flex:1;min-height:0;width:100%;max-width:1040px;display:flex;gap:clamp(12px,2vw,24px)}
.shop-pet{position:relative;flex:1;min-width:0;border-radius:30px;background:radial-gradient(ellipse at 50% 85%,#FFE6F0,#FFF7E8 60%,#FFF);box-shadow:0 8px 0 rgba(29,54,70,.14);display:grid;place-items:center;padding:6% 4% 4%;overflow:hidden}
.shop-pet svg{position:absolute;left:4%;top:6%;width:92%;height:90%}
.shop-pet .dino{animation:breathe 3s ease-in-out infinite}

/* Code game */
.code-wrap{flex:1;min-height:0;width:100%;max-width:1040px;display:flex;gap:clamp(12px,2vw,24px);align-items:stretch}

input{user-select:text;-webkit-user-select:text;color:var(--ink);background:var(--card)}
.txt{font:inherit;font-size:20px;padding:10px 16px;border-radius:16px;border:2px solid #CFDDE6;width:100%;max-width:320px;box-sizing:border-box;margin-top:6px}
.welcome{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,3vw,40px);width:100%}
.wc{flex:none;background:none;padding:0;border:0;filter:drop-shadow(0 8px 0 rgba(29,54,70,.15))}
.wc-bip svg{width:clamp(96px,15vw,170px);height:auto;animation:bob 2.4s ease-in-out infinite}
.wc-com img{width:clamp(110px,18vw,210px);height:auto;display:block;animation:bob 2.8s ease-in-out -.9s infinite}
.wc.hop{animation:wcHop .6s cubic-bezier(.3,1.6,.5,1)}@keyframes wcHop{40%{transform:translateY(-22px) scale(1.06)}}
.wc-mid{display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:clamp(6px,2vh,24px);min-width:0}
.wc-mid h1{margin:0;text-align:center}
.wc-hi{background:#fff;border-radius:999px;padding:6px 18px;font:800 clamp(18px,2.6vw,26px) var(--display);color:var(--berry);box-shadow:0 4px 0 rgba(29,54,70,.12);animation:popIn .6s cubic-bezier(.3,1.6,.5,1)}
@media (orientation:portrait){.welcome{flex-wrap:wrap}.wc-mid{order:3;width:100%}.wc-bip svg{width:26vw}.wc-com img{width:32vw}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(clamp(130px,17vw,180px),230px));gap:clamp(12px,2vw,22px);width:100%;max-width:900px;justify-content:center}
.pcard{background:var(--card);border-radius:30px;padding:clamp(14px,2.4vh,24px) 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;box-shadow:0 8px 0 rgba(29,54,70,.18)}
.pcard:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(29,54,70,.18)}
.pcard .pic{font-size:clamp(56px,9vw,84px);line-height:1}
.pcard b{font-family:var(--display);font-size:clamp(22px,3vw,30px);line-height:1.1}
.pcard small{font-weight:800;font-size:13px;color:var(--soft)}
.pcard .pl,.pcard .pe{position:absolute;top:10px;right:12px;font-style:normal;font-size:20px}
.pcard .pe{left:12px;right:auto}
.pcard.add{background:rgba(255,255,255,.55);box-shadow:none;border:3px dashed #9FB7C5}
.icons{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ic{width:52px;height:52px;border-radius:14px;background:var(--sky2);font-size:30px;display:grid;place-items:center}
.ic.sel{background:var(--sun);box-shadow:0 0 0 3px var(--ink)}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}.tile{min-height:0}}
body.calm .deco *,body.calm .deco *::before,body.calm .deco *::after,body.calm .rays{animation:none!important}

<body>

<div class="deco" aria-hidden="true"><i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>

    <path d="M815 225 L902 95 L958 95 L1045 225 Z" fill="#A9765C" stroke="#1D3646" stroke-width="4" stroke-linejoin="round"/>

      <circle cx="-8" cy="-88" r="5" fill="#8C5A2B"/><circle cx="1" cy="-87" r="5" fill="#8C5A2B"/></g></g>
    <g transform="translate(1110 214) scale(.8)"><g class="palm" style="animation-delay:-2s"><path d="M0 0 Q8 -48 -4 -92" stroke="#8C5A2B" stroke-width="10" fill="none" stroke-linecap="round"/>
      <g fill="#2A8F53"><ellipse cx="-34" cy="-90" rx="30" ry="8" transform="rotate(25 -4 -92)"/><ellipse cx="26" cy="-90" rx="30" ry="8" transform="rotate(-25 -4 -92)"/><ellipse cx="-32" cy="-98" rx="28" ry="7" transform="rotate(-15 -4 -92)"/><ellipse cx="24" cy="-98" rx="28" ry="7" transform="rotate(15 -4 -92)"/><ellipse cx="-4" cy="-112" rx="8" ry="20"/></g></g></g>

<div id="app"></div>
<canvas id="fxc"></canvas>

<script>
// ================= storage (per tablet) =================
// Each profile (child or parent test) has its own progress. Old single-save data becomes Xoài's profile.
const KEY='xoai_v2';
function readLS(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function norm(d){d=Object.assign({stars:0,stickers:0,stkProg:0,limit:20,day:'',used:0,bonus:0,stats:{},voice:'',rate:1,mute:false,music:true,hist:[]},d||{});if(d.earned==null)d.earned=d.stars;
  d.lvl=Object.assign({rule:0,sound:0,num:0,count:0,color:0,shape:0,code:0,memory:0,catch:0,band:0,hide:0,market:0,pattern:0,story:0},d.lvl||{});
  d.pet=Object.assign({hatched:false,taps:0,xp:0,food:3,clean:3,fun:3,last:0,name:'Bé Cốm',color:'#FF8CC0',stageSeen:0},d.pet||{});
  if(!d.comArt){d.comArt=1;if(d.pet.color==='#5BC27A')d.pet.color='#FF8CC0';if(d.shop)d.shop.owned=(d.shop.owned||[]).map(x=>x==='skin-#5BC27A'?'skin-#FF8CC0':x)}
  return d}
let S=readLS(KEY);
if(!S||!S.profiles||!S.profiles.length)S={profiles:[{id:'xoai',name:'Xoài',icon:'🦕'}],cur:'xoai',data:{xoai:readLS('xoai_v1')||{}}};
S.data=S.data||{};S.profiles.forEach(p=>S.data[p.id]=norm(S.data[p.id]));
if(!S.data[S.cur])S.cur=S.profiles[0].id;
let D=S.data[S.cur];
function save(){try{S.data[S.cur]=D;localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function curP(){return S.profiles.find(p=>p.id===S.cur)||S.profiles[0]}
function KID(){const p=curP();return p.test?'bạn':p.name}
function isTest(){return !!curP().test}
function kids(){return S.profiles.filter(p=>!p.test)}
function useProfile(id){S.cur=id;D=S.data[id];try{applyMotion()}catch(e){}save();rollDay();try{pickVoice()}catch(e){}}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function rollDay(){if(D.day!==today()){logDay();D.day=today();D.used=0;D.bonus=0;D.stats={};save()}}
rollDay();

// ================= helpers =================
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const pickOne=a=>a[rand(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let gen=0,cleanups=[];
function onCleanup(f){cleanups.push(f)}
function later(fn,ms){const g=gen;return setTimeout(()=>{if(g===gen)fn()},ms)}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function onResize(f){window.addEventListener('resize',f);onCleanup(()=>window.removeEventListener('resize',f))}

// ================= voice + sound =================
let viVoice=null;
function viVoices(){try{return speechSynthesis.getVoices().filter(v=>/^vi/i.test(v.lang))}catch(e){return[]}}
function voiceScore(v){let s=0;if(/natural|neural|premium|enhanced|online|google/i.test(v.name))s+=10;if(/compact/i.test(v.name))s-=5;return s}
function pickVoice(){const vs=viVoices();viVoice=vs.find(v=>v.name===D.voice)||vs.sort((a,b)=>voiceScore(b)-voiceScore(a))[0]||null}
// voices arrive a moment after launch on some browsers; until then we wait rather than conclude there is no Vietnamese voice
let voicesReady=false;setTimeout(()=>{voicesReady=true},2500);
try{pickVoice();if(viVoice)voicesReady=true;speechSynthesis.onvoiceschanged=()=>{pickVoice();if(viVoice||speechSynthesis.getVoices().length)voicesReady=true;if(screen==='parent')showParent()}}catch(e){}
const IS_WIN=/Windows/i.test(navigator.userAgent),IS_EDGE=/Edg\//.test(navigator.userAgent);
// without a Vietnamese voice the browser reads Vietnamese with an English voice, which teaches wrong sounds; stay silent and tell the parent instead
function canSpeak(t,again){if(viVoice)return true;if(!voicesReady){if(!again)setTimeout(()=>{if(viVoice)again(t)},600);return false}noVoiceNotice();return false}
let noVoiceShown=false;
function noVoiceNotice(){if(noVoiceShown||!document.body)return;noVoiceShown=true;
  const n=document.createElement('div');n.className='novoice';n.innerHTML=`<b>🔇 Máy này chưa có giọng đọc tiếng Việt</b><span>Bíp sẽ tạm không đọc để bé không nghe sai dấu. ${voiceHelp(true)}</span><button class="chip" id="nvOk">Đã hiểu</button>`;
  document.body.appendChild(n);$('#nvOk').onclick=()=>n.remove();setTimeout(()=>n.remove(),20000)}
function voiceHelp(short){
  if(IS_WIN&&!IS_EDGE)return 'Cách nhanh nhất: mở app bằng trình duyệt <b>Microsoft Edge</b> (có sẵn giọng Việt tự nhiên HoaiMy, NamMinh khi có mạng).';
  if(IS_WIN)return 'Edge cần có mạng để dùng giọng Việt HoaiMy/NamMinh. Nếu đang có mạng mà vẫn không có: Cài đặt Windows → Thời gian & ngôn ngữ → Ngôn ngữ & khu vực → Thêm ngôn ngữ → Tiếng Việt (chọn cả Chuyển văn bản thành giọng nói), rồi mở lại trình duyệt.';
  return 'Vào Cài đặt của máy → Giọng nói / Chuyển văn bản thành giọng nói → tải giọng Tiếng Việt, rồi mở lại app.'}
let lastSay=0;
let talkT=0;
function talking(on,ms){clearTimeout(talkT);document.body.classList.toggle('talking',on);duck(on);if(on)talkT=setTimeout(()=>{document.body.classList.remove('talking');duck(false)},ms)}
let sayId=0;
// say(t, then): `then` runs when this sentence ends by itself; a newer sentence cancels it. Without a Vietnamese voice we stay silent
// (an English voice would teach wrong sounds) but still run `then` after a reading-length pause so the game keeps flowing.
function say(t,then,_id){const id=_id||++sayId,est=Math.min(6000,600+String(t).length*75);const done=()=>{if(then&&id===sayId){const f=then;then=null;f()}};
  const quiet=()=>setTimeout(done,Math.min(4000,400+String(t).length*55));
  if(D.mute){quiet();return}
  if(!viVoice){if(!voicesReady){setTimeout(()=>{if(id!==sayId)return;if(viVoice)say(t,then,id);else{noVoiceNotice();quiet()}},700);return}noVoiceNotice();quiet();return}
  lastSay=Date.now();
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.voice=viVoice;u.rate=D.rate||1;u.pitch=1;
    u.onend=()=>{talking(false);done()};u.onerror=()=>{talking(false);done()};talking(true,est);speechSynthesis.speak(u);
    if(then)setTimeout(done,est+3000) /* some browsers never send 'end' */}catch(e){quiet()}}
// intro of a new twist, then always the instruction for this screen
function sayThen(a,b,after){say(a,()=>say(b,after))}
// awaitable: resolves when the sentence has finished (or another sentence replaced it), never sooner than min ms
function sayW(t,min=0){return new Promise(res=>{const t0=Date.now();let ok=false;say(t,()=>{ok=true});const my=sayId;
  const iv=setInterval(()=>{const el=Date.now()-t0;if(sayId!==my||((ok||el>12000)&&el>=min)){clearInterval(iv);res()}},60)})}
function hush(){talking(false);try{speechSynthesis.cancel()}catch(e){}}
function setSay(t){const s=$('#say');if(!s)return;s.innerHTML=t;const b=s.closest('.bubble');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}

// ================= confetti + flying stars =================
const RM=()=>D&&D.motion==='calm';
function applyMotion(){document.body.classList.toggle('calm',RM())}
const FX={parts:[],raf:0};
function fxLoop(){const c=$('#fxc');if(!c)return;const ctx=c.getContext('2d');const dpr=Math.min(2,window.devicePixelRatio||1);
  if(c.width!==innerWidth*dpr||c.height!==innerHeight*dpr){c.width=innerWidth*dpr;c.height=innerHeight*dpr}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const p of FX.parts){p.vy+=p.g/60;p.vx*=.99;p.x+=p.vx/60;p.y+=p.vy/60;p.r+=p.vr/60;p.life-=1/60;
    ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,p.life*2));ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
    if(p.round){ctx.beginPath();ctx.arc(0,0,p.s/2,0,7);ctx.fill()}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()}
  FX.parts=FX.parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  FX.raf=FX.parts.length?requestAnimationFrame(fxLoop):(ctx.clearRect(0,0,innerWidth,innerHeight),0)}
const CONF=['#FF5C7A','#FFC83D','#38B26A','#2F7DF6','#8E5CF6','#FF8A3D'];
function confetti(n=140){if(RM())return;
  for(let i=0;i<n;i++)FX.parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.4,vx:(Math.random()-.5)*160,vy:100+Math.random()*200,g:300,r:Math.random()*6,vr:(Math.random()-.5)*12,s:8+Math.random()*8,c:pickOne(CONF),life:3+Math.random(),round:Math.random()<.3});
  if(!FX.raf)FX.raf=requestAnimationFrame(fxLoop)}
function sparkAt(x,y,n=24,colors=CONF){if(RM())return;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=180+Math.random()*320;FX.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-150,g:700,r:0,vr:(Math.random()-.5)*14,s:7+Math.random()*7,c:pickOne(colors),life:1+Math.random()*.4,round:Math.random()<.5})}
  if(!FX.raf)FX.raf=requestAnimationFrame(fxLoop)}
function sparkEl(el,n){if(!el)return;const r=el.getBoundingClientRect();sparkAt(r.left+r.width/2,r.top+r.height/2,n)}
function flyStars(fromEl,n){const target=$('#starN')||$('.pill');if(!fromEl||!target)return;const a=fromEl.getBoundingClientRect(),b=target.getBoundingClientRect();
  for(let i=0;i<n;i++){const s=document.createElement('div');s.className='flystar';s.textContent='⭐';s.style.left=(a.left+a.width/2-17)+'px';s.style.top=(a.top+a.height/2-17)+'px';document.body.appendChild(s);
    setTimeout(()=>{s.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(.6)`},40+i*120);
    setTimeout(()=>{s.remove();const pill=target.closest('.pill');if(pill){pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump')}tone('step')},900+i*120)}}
// ---------- sound engine: synthesized effects + generative background music ----------
let ac=null,sfxBus=null,musicBus=null,noiseBuf=null;
function audio(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
    const master=ac.createGain();master.connect(ac.destination);
    const comp=ac.createDynamicsCompressor();comp.connect(master);
    sfxBus=ac.createGain();sfxBus.gain.value=.9;sfxBus.connect(comp);
    musicBus=ac.createGain();musicBus.gain.value=0;
    const mlp=ac.createBiquadFilter();mlp.type='lowpass';mlp.frequency.value=2600;mlp.Q.value=.3;musicBus.connect(mlp);mlp.connect(comp);
    const dl=ac.createDelay(1),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.3;fb.gain.value=.22;wet.gain.value=.18;mlp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(comp);
    const len=ac.sampleRate*1.5;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}
  if(ac.state==='suspended')ac.resume();return ac}
function env(g,t,a,peak,dec){t=Math.max(t,ac.currentTime);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec)}
function osc(type,f,t,dur,peak,o={}){const bus=o.bus||sfxBus,a=o.a||.01;t=Math.max(t,ac.currentTime);const n=ac.createOscillator(),g=ac.createGain();n.type=type;n.frequency.setValueAtTime(f,t);
  if(o.to)n.frequency.exponentialRampToValueAtTime(o.to,t+dur);env(g,t,a,peak,dur);n.connect(g).connect(bus);n.start(t);n.stop(t+a+dur+.05);return n}
function noise(t,dur,peak,o={}){t=Math.max(t,ac.currentTime);const bus=o.bus||sfxBus,a=o.a||.005;const s=ac.createBufferSource();s.buffer=noiseBuf;const fl=ac.createBiquadFilter();fl.type=o.type||'lowpass';
  fl.frequency.setValueAtTime(o.f||1000,t);if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+dur);fl.Q.value=o.q||1;const g=ac.createGain();env(g,t,a,peak,dur);
  s.connect(fl).connect(g).connect(bus);s.start(t,Math.random());s.stop(t+a+dur+.05)}
function bell(f,t,peak=.16,dur=.6,bus){osc('sine',f,t,dur,peak,{bus});osc('triangle',f*2,t,dur*.45,peak*.22,{bus});osc('sine',f*3.01,t,dur*.2,peak*.08,{bus})}
const SFX={
  ok:t=>[523,659,784,1047].forEach((f,i)=>bell(f,t+i*.09)),
  tap:t=>osc('triangle',880,t,.07,.12,{to:1250}),
  step:t=>osc('sine',720,t,.06,.08,{to:520}),
  no:t=>{osc('sine',330,t,.16,.13,{to:262});osc('sine',262,t+.19,.3,.13,{to:196})},
  pop:t=>{osc('sine',420,t,.11,.22,{to:1250});osc('triangle',1600,t+.05,.07,.05)},
  bonk:t=>{noise(t,.1,.25,{f:420});osc('sine',240,t,.45,.24,{to:70})},
  munch:t=>{for(let i=0;i<4;i++)noise(t+i*.17,.07,.38,{type:'bandpass',f:800+Math.random()*600,q:2.2})},
  giggle:t=>[0,1,2,3,4].forEach(i=>osc('sine',760+i*110+(i%2)*220,t+i*.07,.07,.12,{to:980+i*140})),
  lull:t=>[784,659,698,587,523].forEach((f,i)=>bell(f,t+i*.42,.11,1.3)),
  roar:t=>{const o=ac.createOscillator(),lfo=ac.createOscillator(),lg=ac.createGain(),fl=ac.createBiquadFilter(),g=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(190,t);o.frequency.linearRampToValueAtTime(280,t+.22);o.frequency.exponentialRampToValueAtTime(130,t+.8);
    lfo.frequency.value=24;lg.gain.value=22;lfo.connect(lg).connect(o.frequency);
    fl.type='lowpass';fl.Q.value=4;fl.frequency.setValueAtTime(600,t);fl.frequency.linearRampToValueAtTime(1800,t+.25);fl.frequency.exponentialRampToValueAtTime(400,t+.85);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+.9);
    o.connect(fl).connect(g).connect(sfxBus);o.start(t);lfo.start(t);o.stop(t+.95);lfo.stop(t+.95);noise(t,.8,.08,{type:'bandpass',f:900,to:400,q:.8,a:.08})},
  launch:t=>{noise(t,1.5,.3,{type:'bandpass',f:180,to:3200,q:.7,a:.25});osc('sawtooth',70,t,1.2,.07,{to:35})},
  bubble:t=>{for(let i=0;i<3;i++)osc('sine',500+Math.random()*700,t+i*.06,.06,.07,{to:1500})},
  whoosh:t=>noise(t,.32,.1,{type:'bandpass',f:500,to:2600,q:1}),
  chime:t=>[1047,1319,1568,2093].forEach((f,i)=>bell(f,t+i*.06,.07,.9)),
  hatch:t=>{for(let i=0;i<5;i++)noise(t+i*.05,.05,.3,{type:'highpass',f:2000+i*400});[784,988,1175,1568].forEach((f,i)=>bell(f,t+.3+i*.08,.12,.7))}
};

function enterProfile(id){showHome._back=false;useProfile(id);goFull();musicOn();warmSkin(D.pet.color);warmSpecies();if(overLimit())showSleep();else{showHome();say(`Chào ${KID()}! Hôm nay mình chơi gì nào?`)}}
function showStart(manage=false){
  screen='start';
  const cards=S.profiles.map(p=>`<button class="pcard" data-p="${p.id}"><span class="pic">${p.icon}</span><b>${p.name}</b>${p.pin?'<i class="pl" aria-label="Có mã">🔒</i>':''}${p.test?'<small>Người lớn</small>':''}${manage?'<i class="pe">✏️</i>':''}</button>`).join('');
  render(`<div class="top"><span></span>${manage?'<button class="chipbtn" id="done">✓ Xong</button>':'<button class="icon-btn lock" id="lock" aria-label="Quản lý hồ sơ">⚙️</button>'}</div>
    <div class="center" style="max-width:1100px">
    ${manage?'':`<div class="welcome"><button class="wc wc-bip" id="wcBip" aria-label="Bíp">${bip('x','wave')}</button>
      <div class="wc-mid"><div class="wc-hi">${hiWord()}</div><h1>Ai đang chơi nào?</h1></div>
      <button class="wc wc-com" id="wcCom" aria-label="Bé Cốm"><img src="${COM_SRC.chao}" alt="" draggable="false"></button></div>`}
    ${manage?'<h1>Quản lý hồ sơ</h1>':''}
    ${manage?'<p class="muted" style="margin:0">Chạm vào hồ sơ để sửa tên, biểu tượng, mã hoặc xoá.</p>':''}
    <div class="pgrid">${cards}${manage?'<button class="pcard add" id="add"><span class="pic">＋</span><b>Thêm hồ sơ</b></button>':''}</div></div>`);
  $$('[data-p]').forEach(b=>b.onclick=()=>{tone('tap');const p=S.profiles.find(x=>x.id===b.dataset.p);
    const go=()=>manage?editProfile(p):enterProfile(p.id);
    p.pin?askPin(p,go,()=>showStart(manage)):go()});
  if(manage){$('#done').onclick=()=>showStart();$('#add').onclick=()=>editProfile(null)}
  else{$('#lock').onclick=()=>{parentBack='start';showGate(()=>showStart(true))};
    // tapping the characters is the first touch on a fresh launch, so it also unlocks sound and speech
    $('#wcBip').onclick=()=>{tone('giggle');restartAnim($('#wcBip'),'hop');say(`${hiWord()} Chạm vào tên của mình để vào chơi nhé!`)};
    $('#wcCom').onclick=()=>{tone('roar');restartAnim($('#wcCom'),'hop');say('Bé Cốm chào bạn!')}}
}
function hiWord(){const h=new Date().getHours();return h<11?'Chào buổi sáng!':h<14?'Chào buổi trưa!':h<18?'Chào buổi chiều!':'Chào buổi tối!'}
function keypadHTML(keys){return `<div class="keypad">${keys.map(k=>k===''?'<span></span>':`<button data-k="${k}">${k}</button>`).join('')}</div>`}
function askPin(p,ok,cancel){
  screen='gate';let typed='';
  render(`<div class="center"><div class="panel" style="align-items:center;text-align:center;max-width:420px">
    <span style="font-size:64px;line-height:1">${p.icon}</span><h2>Nhập mã của ${p.name}</h2>
    <div class="answer" id="ans" style="letter-spacing:.3em">○○○○</div>
    ${keypadHTML([1,2,3,4,5,6,7,8,9,'',0,'⌫'])}
    <button class="chip" id="cancel">Quay lại</button></div></div>`);
  const show=()=>$('#ans').textContent='●'.repeat(typed.length)+'○'.repeat(4-typed.length);
  $$('.keypad button').forEach(btn=>btn.onclick=()=>{const k=btn.dataset.k;tone('tap');
    if(k==='⌫'){typed=typed.slice(0,-1);show();return}
    if(typed.length<4)typed+=k;show();
    if(typed.length===4){if(typed===p.pin){later(ok,150)}else{tone('no');const an=$('#ans');an.classList.add('shake');later(()=>{an.classList.remove('shake');typed='';show()},450)}}});
  $('#cancel').onclick=cancel;
}
function editProfile(p){
  screen='gate';const isNew=!p;
  const f=p?{...p}:{id:'k'+Date.now(),name:'',icon:'🦖',pin:'',test:false};
  let delStep=0,resetStep=0;
  render(`<div class="center" style="justify-content:flex-start"><div class="panel">
    <h2>${isNew?'Hồ sơ mới':'Sửa hồ sơ '+f.name}</h2>
    <label><b>Tên</b><br><input id="pName" class="txt" maxlength="16" value="${f.name}" placeholder="Ví dụ: Xoài"></label>
    <div><b>Biểu tượng</b><div class="icons">${ICONS.map(i=>`<button class="ic ${i===f.icon?'sel':''}" data-ic="${i}">${i}</button>`).join('')}</div></div>
    <label><b>Mã 4 số</b> <span class="muted">(cần nhập khi vào, sửa hoặc xoá hồ sơ này; để trống nếu không cần)</span><br>
      <input id="pPin" class="txt" inputmode="numeric" maxlength="4" value="${f.pin||''}" style="letter-spacing:.3em;max-width:170px"></label>
    <label class="row" style="flex-wrap:nowrap"><input type="checkbox" id="pAdult" ${f.test?'checked':''} style="width:26px;height:26px;flex:none">
      <span><b>Hồ sơ người lớn</b> <span class="muted">(để thử app, không tính giờ chơi)</span></span></label>
    <p id="pErr" style="margin:0;color:#C93A55;font-weight:800"></p>
    <div class="row"><button class="big-btn" id="pSave">Lưu</button><button class="chip" id="pCancel">Huỷ</button></div>
    ${isNew?'':`<div class="row" style="border-top:1px solid #DDE8EE;padding-top:14px"><button class="chip" id="pReset">Xoá tiến độ chơi</button>${S.profiles.length>1?'<button class="chip" id="pDel" style="background:#FFE1E6">🗑️ Xoá hồ sơ</button>':''}</div>`}
  </div></div>`);
  $$('.ic').forEach(b=>b.onclick=()=>{f.icon=b.dataset.ic;$$('.ic').forEach(x=>x.classList.toggle('sel',x===b));tone('tap')});
  $('#pCancel').onclick=()=>showStart(true);
  $('#pSave').onclick=()=>{
    const name=clean($('#pName').value),pin=$('#pPin').value.trim(),err=$('#pErr');
    if(!name){err.textContent='Nhập tên cho hồ sơ nhé.';return}
    if(pin&&!/^\d{4}$/.test(pin)){err.textContent='Mã phải đúng 4 chữ số, hoặc để trống.';return}
    Object.assign(f,{name,pin,test:$('#pAdult').checked});
    if(isNew){S.profiles.push(f);S.data[f.id]=norm({limit:D.limit,voice:D.voice,rate:D.rate,mute:D.mute})}
    else Object.assign(S.profiles.find(x=>x.id===f.id),f);
    save();tone('ok');showStart(true)};
  if(isNew)return;
  $('#pReset').onclick=e=>{if(!resetStep++){e.target.textContent=`Chạm lần nữa để xoá sao, sticker, màn chơi và khủng long của ${f.name}`;return}
    const old=S.data[f.id];S.data[f.id]=norm({limit:old.limit,voice:old.voice,rate:old.rate,mute:old.mute,day:old.day,used:old.used,bonus:old.bonus});
    if(S.cur===f.id)D=S.data[f.id];save();e.target.textContent='Đã xoá tiến độ';tone('ok')};
  if($('#pDel'))$('#pDel').onclick=e=>{if(!delStep++){e.target.textContent=`Chạm lần nữa để xoá vĩnh viễn ${f.name}`;return}
    S.profiles=S.profiles.filter(x=>x.id!==f.id);delete S.data[f.id];
    if(S.cur===f.id){S.cur=S.profiles[0].id;D=S.data[S.cur]}save();showStart(true)};
}

  ctx.textAlign='center';
  for(const t of K.texts){ctx.globalAlpha=Math.min(1,t.life*2);ctx.font=`800 ${Math.max(24,W*(t.big?.06:.04))}px "Baloo 2",system-ui`;ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(t.txt,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.txt,t.x,t.y)}ctx.globalAlpha=1;

}

  },()=>{lastX=null;if(P.rub>250){tone('ok');say(p.clean>=4.5?'Thơm tho quá!':'Kỳ cọ thêm chút nữa nhé!');if(p.clean>=4.5){p.xp+=.5;sparkEl($('#dw'),20);fx('✨',55,20)}save();P.rub=0;P.say=petHint();setSay(P.say)}});

function bandNote(i,vis=true){try{audio();const f=BAND[i][2],t=ac.currentTime+.01;bell(f,t,.36,.9);osc('triangle',f/2,t,.4,.09,{a:.02})}catch(e){}
  const pad=$$('.bpad')[i];if(!pad||!vis)return;pad.classList.remove('sing');void pad.offsetWidth;pad.classList.add('sing');clearTimeout(pad._t);pad._t=setTimeout(()=>pad.classList.remove('sing'),420);

async function playSeq(){
  const g=gen;B.mode='listen';B.pos=0;$$('.bpad').forEach(p=>p.classList.add('dim'));
  B.say='Nghe Bíp hát nhé!';setSay(B.say);await sayW(B.say,1000);

  if(g!==gen||B.free)return;$$('.bpad').forEach(p=>p.classList.remove('dim'));

function bandPress(i){

    B.seq.push(rand(0,B.n-1));later(async()=>{await bandJingle(false);later(playSeq,500)},800);
  }else{
    B.mode='wait';B.miss++;B.help=true;stat('band',false);later(()=>{tone('no');bipReact('sad');say('Gần đúng rồi! Nghe lại nhé.')},350);later(playSeq,2200);
  }
}

// ---------- handwriting letters (Vietnamese school handwriting, lowercase) ----------
// Units: 1 = one "ô li". Baseline (đường kẻ 1) y=0, đường kẻ 2 y=-1, đường kẻ 3 y=-2 ... đường kẻ 6 y=-5; below the baseline +1,+2,+3.
// Each stroke is one pen-down movement in writing order and direction. Letters written without lifting the pen (u, y, b, r, s, p...) are one stroke.
const HW=(()=>{
  const L=(a,b,c,d)=>{const n=Math.max(2,Math.ceil(Math.hypot(c-a,d-b)/.08));return Array.from({length:n+1},(_,i)=>[a+(c-a)*i/n,b+(d-b)*i/n])};
  const C=(p0,p1,p2,p3)=>Array.from({length:33},(_,i)=>{const t=i/32,m=1-t;return[m*m*m*p0[0]+3*m*m*t*p1[0]+3*m*t*t*p2[0]+t*t*t*p3[0],m*m*m*p0[1]+3*m*m*t*p1[1]+3*m*t*t*p2[1]+t*t*t*p3[1]]});
  const Q=(p0,p1,p2)=>Array.from({length:21},(_,i)=>{const t=i/20,m=1-t;return[m*m*p0[0]+2*m*t*p1[0]+t*t*p2[0],m*m*p0[1]+2*m*t*p1[1]+t*t*p2[1]]});
  const A=(cx,cy,rx,ry,a0,a1)=>{const n=Math.ceil(Math.abs(a1-a0)/3);return Array.from({length:n+1},(_,i)=>{const a=(a0+(a1-a0)*i/n)*Math.PI/180;return[cx+rx*Math.cos(a),cy+ry*Math.sin(a)]})};
  const J=(...s)=>[].concat(...s);
  const S=(name,pts,d=false)=>({name,pts,d});
  // building blocks
  const ring=(cx=1)=>A(cx,-1,.9,1,-62,-425);                                   // cong kín: starts just under đường kẻ 3, right to left
  const hook=x=>C([x,-.5],[x,.07],[x+.5,.07],[x+.62,-.95]);                     // foot of a móc ngược, rising to đường kẻ 2
  const mocNguoc=(x,top)=>J(L(x,top,x,-.5),hook(x));
  const hat=(x1,top,y0=-1)=>L(x1-.5,y0,x1,top);                                  // nét hất from đường kẻ 2 up to the top
  const bowlUp=(x0,x1)=>C([x0,-.5],[x0,.07],[x1-.15,.07],[x1,-.9]);              // round bottom of the first móc, rising to đường kẻ 2
  const mocXuoi=x=>J(Q([x-.45,-1.6],[x-.12,-2.15],[x,-1.85]),L(x,-1.85,x,0));
  const arch=(x0,x1)=>J(C([x0,-1],[x0+.1,-2.05],[x1,-2.25],[x1,-1.45]),L(x1,-1.45,x1,-.5),hook(x1));   // nét móc hai đầu
  const loopUp=x=>J(C([x-.35,-1],[x+.15,-2.7],[x+.85,-5.05],[x+.2,-5.05]),C([x+.2,-5.05],[x-.3,-5.05],[x,-4.2],[x,-3.2])); // nét khuyết xuôi (top part)
  const loopDown=x=>J(L(x,-2,x,1.6),C([x,1.6],[x,3.05],[x-.95,3.05],[x-.75,2.1]),C([x-.75,2.1],[x-.55,1.0],[x+.3,-.3],[x+.65,-1]));  // nét khuyết ngược, back up to đường kẻ 2
  const cap=cx=>S('dấu mũ',J(L(cx-.45,-2.5,cx,-3.1),L(cx,-3.1,cx+.45,-2.5)),true);
  const breve=cx=>S('dấu mũ ngửa',C([cx-.45,-3.15],[cx-.4,-2.45],[cx+.4,-2.45],[cx+.45,-3.15]),true);
  const rau=(x,y)=>S('dấu râu',Q([x,y],[x+.5,y-.05],[x+.55,y-.55]),true);
  const dot=(x,y)=>S('dấu chấm',L(x,y,x+.02,y+.02),true);
  const o=[S('nét cong kín',ring())],a=[S('nét cong kín',ring()),S('nét móc ngược',mocNguoc(1.9,-2))];
  const e=[S('nét cong',J(C([.25,-.95],[1.3,-1.05],[1.75,-1.55],[1.45,-1.95]),C([1.45,-1.95],[1.1,-2.25],[.15,-2.0],[.15,-1.0]),C([.15,-1.0],[.15,-.15],[1.0,.1],[1.7,-.6])))];
  const u=[S('nét hất và hai nét móc ngược',J(hat(.6,-2),L(.6,-2,.6,-.5),bowlUp(.6,1.6),L(1.6,-.9,1.6,-2),L(1.6,-2,1.6,-.5),hook(1.6)))];
  const d=[S('nét cong kín',ring()),S('nét móc ngược',mocNguoc(1.9,-4))];
  const kx=x=>J(loopUp(x),L(x,-3.2,x,0));
  return {
    o, 'ô':[...o,cap(1)], 'ơ':[...o,rau(1.72,-1.65)],
    a, 'ă':[...a,breve(1)], 'â':[...a,cap(1)],
    e, 'ê':[...e,cap(.95)],
    u, 'ư':[...u,rau(1.6,-1.95)],
    i:[S('nét hất và nét móc ngược',J(hat(.6,-2),mocNguoc(.6,-2))),dot(.6,-2.85)],

    cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
    const b=hwBox(l),pad=1.0,bw=b.x1-b.x0+pad*2,bh=b.y1-b.y0+pad*2;u=Math.min(W/bw,H/bh,H/3.6);
    ox=W/2-(b.x0+b.x1)/2*u;oy=H/2-(b.y0+b.y1)/2*u;tol=Math.max(24,u*.62);R=strokes.map(s=>resample(s.pts));T.ink=[];draw()}
  const isDot=k=>R[k].length<4;
  function poly(pts,w,c,dash){if(pts.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=w;ctx.strokeStyle=c;if(dash)ctx.setLineDash(dash);
    ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.stroke();ctx.restore()}
  function dotAt(p,r,fill,txt,ring){ctx.save();ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
    if(ring){ctx.beginPath();ctx.arc(p[0],p[1],r+6+3*Math.sin(performance.now()/200),0,7);ctx.strokeStyle=fill;ctx.globalAlpha=.5;ctx.lineWidth=4;ctx.stroke()}
    if(txt){ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.font=`800 ${Math.round(r*1.2)}px Nunito,system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,p[0],p[1]+1)}ctx.restore()}
  function arrows(pts,from){const gap=Math.max(6,Math.round(u*1.0/Math.max(3,u*.08)));ctx.save();ctx.fillStyle='rgba(47,125,246,.55)';
    for(let i=from+gap;i<pts.length-gap/2;i+=gap){const a=pts[i-1],b=pts[Math.min(pts.length-1,i+1)],ang=Math.atan2(b[1]-a[1],b[0]-a[0]),s=Math.max(7,u*.16);
      ctx.save();ctx.translate(pts[i][0],pts[i][1]);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(s,0);ctx.lineTo(-s*.7,-s*.75);ctx.lineTo(-s*.3,0);ctx.lineTo(-s*.7,s*.75);ctx.closePath();ctx.fill();ctx.restore()}

const mkWho=()=>D.pet.hatched?D.pet.name:'Bíp';
function startMarket(){MK={round:0,rounds:3,miss:0};marketRound()}
function marketRound(){
  // from level 6 some items are wanted twice ("hai cà rốt"), so the child remembers the item and how many
  screen='brain';const lv=D.lvl.market||0,qty=lv>=6,len=lv<2?2:lv<5?3:lv<9?(qty?3:4):4;const pool=shuffle(MARKET);
  const list=pool.slice(0,len).map(([e,n],i)=>[e,n,qty&&(i===0||(lv>=9&&i===2)||Math.random()<.25)?2:1]);
  Object.assign(MK,{slips:0,list:shuffle(list),extra:pool.slice(len,len+Math.min(8,len*2+2)-len),got:[],cnt:{},units:list.reduce((a,x)=>a+x[2],0),first:true,replays:0,phase:'listen',say:`Nghe ${mkWho()} dặn nhé!`});
  render(`${topBar(gdots(MK.rounds,MK.round))}${guide(MK.say)}
    <div class="mk-wrap"><div class="mk-req" id="mkq"><div class="mk-pet">${D.pet.hatched?dino(D.pet):bip('x','point')}</div><div class="mk-cloud" id="mkc"></div></div>
      <div class="mk-market" id="mkm" hidden><div class="awning"></div><div class="mk-stall" id="mks"></div></div>
      <div class="mk-basket" id="mkb" hidden><span class="bk">🧺</span><span class="bi" id="mkbi">${'<i></i>'.repeat(MK.units)}</span></div></div>
    <div class="row" style="justify-content:center"><button class="chipbtn" id="mkr" hidden>🔁 Nghe dặn lại (1 lần)</button></div>`);
  wireCommon(()=>MK.say);
  $('#mkr').onclick=()=>{if(MK.replays>=1||MK.phase!=='shop')return;MK.replays++;MK.first=false;tone('tap');$('#mkr').hidden=true;mkTell()};
  if(qty&&unlockToast('marketqty','Mới! Có món cần mua hai cái. Nhớ cả số lượng nhé!')){say('Mới! Có món cần mua hai cái. Nhớ cả số lượng nhé!');later(mkTell,3800)}else mkTell();
}
async function mkTell(){
  const g=gen;MK.phase='listen';$('#mkm').hidden=true;$('#mkb').hidden=true;$('#mkq').hidden=false;const c=$('#mkc');c.innerHTML='';c.classList.remove('fade');
  await sayW(`${KID()} ơi, ${mkWho()} muốn ăn...`,1200);
  for(const [e,n,q] of MK.list){if(g!==gen)return;c.insertAdjacentHTML('beforeend',`<span class="mki">${q>1?`<span class="mkq">${e}${e}</span>`:e}<b>${q>1?'2 ':''}${n}</b></span>`);tone('pop');await sayW(q>1?`hai ${n}`:n,q>1?1500:1200);await wait(300)}
  if(g!==gen)return;await sayW(MK.units>MK.list.length?`Nhớ chưa? Tất cả ${MK.units} món nhé!`:`Nhớ chưa? ${MK.list.length} món nhé!`,1500);if(g!==gen)return;
  c.classList.add('fade');await wait(600);if(g!==gen)return;
  $('#mkq').hidden=true;MK.phase='shop';
  const all=shuffle([...MK.list,...MK.extra]);
  $('#mks').innerHTML=all.map(([e,n],i)=>`<button class="mkitem${MK.got.includes(n)?' taken':''}" data-n="${n}" style="animation-delay:${(i*.05).toFixed(2)}s" aria-label="${n}">${e}</button>`).join('');
  $('#mkm').hidden=false;$('#mkb').hidden=false;if(MK.replays<1)$('#mkr').hidden=false;
  MK.say=`Ra chợ chọn đúng các món ${mkWho()} dặn nhé!`;setSay(MK.say);say(MK.say);
  $$('.mkitem').forEach(b=>b.onclick=()=>mkPick(b,b.dataset.n));
}
function mkPick(b,n){
  if(MK.phase!=='shop'||b.classList.contains('taken'))return;
  const want=MK.list.find(x=>x[1]===n);
  if(want&&(MK.cnt[n]||0)<want[2]){MK.cnt[n]=(MK.cnt[n]||0)+1;const c=MK.cnt[n];if(c>=want[2])b.classList.add('taken');MK.got.push(n);tone('pop');say(want[2]>1?(c===1?`một ${n}`:`hai ${n}`):n);stat('market',true);
    if(want[2]>1&&c<want[2]){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}
    const slot=$$('#mkbi i')[MK.got.length-1];if(slot){slot.textContent=want[0];slot.classList.add('in')}
    const bk=$('#mkb');bk.classList.remove('bump');void bk.offsetWidth;bk.classList.add('bump');
    if(MK.got.length===MK.units){MK.phase='done';$('#mkr').hidden=true;later(()=>{tone('munch');bipReact('happy');confetti(60);sparkEl($('#mkb'),24);
      say(`${pickOne(PRAISE())} Đủ hết rồi! ${mkWho()} cảm ơn ${KID()}!`);if(D.pet.hatched){D.pet.food=Math.min(5,D.pet.food+.5)}},400);
      {const lv=D.lvl.market||0;D.lvl.market=MK.first?lv+1:MK.slips>=2&&lv>0?lv-1:lv}save();MK.round++;dotOn(MK.round);
      if(MK.round>=MK.rounds){const st=starsFor(MK.miss);award(st);later(()=>showDone('market',st,'Trí nhớ siêu quá!'),2600)}else later(marketRound,2800)}
  }else{MK.miss++;MK.slips=(MK.slips||0)+1;MK.first=false;stat('market',false);tone('no');bipReact('sad');b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');say(want?`Đủ ${n} rồi!`:`${mkWho()} không dặn mua ${n}`)}
}

// ---------- 3. Quy luật tiếp theo (logic) ----------
const PT_TOKENS={
  egg:()=>shuffle(COLORS).slice(0,4).map(([n,c])=>({art:egg(c),name:`trứng màu ${n}`})),
  dino:()=>{const c=pickOne(DCOL)[1];return shuffle(SPECIES).slice(0,4).map(([k,n])=>({art:dinoArt(k,c),name:n}))},
  shape:()=>{const cs=shuffle(COLORS);return shuffle(Object.keys(SHAPES)).slice(0,4).map((n,i)=>({art:shape(n,cs[i][1]),name:n}))}};
const PT_NOTES=[523.25,659.25,783.99,1046.5];
let PT=null;
function startPattern(){PT={round:0,rounds:5,miss:0};patternRound()}
function patternRound(){
  screen='brain';const lv=D.lvl.pattern||0;
  const units=lv<2?['AB']:lv<4?['AB','AAB','ABB']:lv<10?['ABC','AABB','AAB','ABB','ABC']:['ABC','AABB','ABCD','ABAC','AABC'];const unit=pickOne(units);
  const set=pickOne(lv<2?['egg','dino']:['egg','dino','shape']);const toks=PT_TOKENS[set]();
  const L=unit.length,len=Math.max(6,L*2+Math.min(L,2));const seq=Array.from({length:len},(_,i)=>unit.charCodeAt(i%L)-65);
  // from level 7 there are two gaps; they are filled left to right
  let holes=[lv<3?len-1:rand(L,len-1)];
  if(lv>=7){const h=rand(L,len-2);holes=[h,rand(h+1,len-1)]}
  Object.assign(PT,{slips:0,seq,holes,hi:0,hole:holes[0],ans:seq[holes[0]],toks,first:true,tries:0,say:holes.length>1?'Có hai chỗ trống! Cái gì ở chỗ trống đầu tiên? Chọn ở dưới nhé.':'Cái gì vào chỗ trống nào? Chọn ở dưới nhé.'});
  render(`${topBar(gdots(PT.rounds,PT.round))}${guide(PT.say)}
    <div class="pt-track"><div class="pt-row" style="--n:${len}">${seq.map((t,i)=>`<div class="pt-cell${holes.includes(i)?' hole':''}${i===holes[0]?' cur':''}" data-i="${i}" style="animation-delay:${(i*.07).toFixed(2)}s">${holes.includes(i)?'<span class="q">?</span>':toks[t].art}</div>`).join('')}</div></div>
    <div class="choices" id="ptc"></div>`);
  wireCommon(()=>PT.say);ptOptions(.5);
  const news={4:'Mới! Quy luật có ba bạn rồi!',7:'Thử thách! Có hai chỗ trống, tìm cả hai nhé!',10:'Thử thách! Quy luật dài hơn nữa!'}[lv];
  if(news&&unlockToast('pattern'+lv,news)){say(news);later(()=>ptPlay(PT.hole),3400)}else later(()=>ptPlay(PT.hole),500);
}
function ptOptions(delay=0){const {seq,ans,toks}=PT;const used=[...new Set(seq)],distract=toks.map((t,i)=>i).filter(i=>i!==ans);
  const opts=shuffle([ans,...shuffle(distract.filter(i=>used.includes(i))).slice(0,1),...shuffle(distract.filter(i=>!used.includes(i))).slice(0,1)]).slice(0,3);
  while(opts.length<3){const x=distract.find(i=>!opts.includes(i));if(x==null)break;opts.push(x)}
  $('#ptc').innerHTML=opts.map((t,k)=>`<button class="pick ptpick" data-t="${t}" style="animation-delay:${(delay+k*.1).toFixed(1)}s">${toks[t].art}</button>`).join('');
  $$('.ptpick').forEach(b=>b.onclick=()=>ptPick(b,+b.dataset.t))}
async function ptPlay(upto,full){const g=gen;const cells=$$('.pt-cell');
  for(let i=0;i<(full?cells.length:upto);i++){if(g!==gen)return;const c=cells[i];if(c.classList.contains('hole'))continue;c.classList.remove('beat');void c.offsetWidth;c.classList.add('beat');
    try{audio();bell(PT_NOTES[PT.seq[i]],ac.currentTime+.01,.13,.45)}catch(e){}await wait(full?330:430)}
  if(!full&&g===gen)say(PT.say)}
function ptPick(b,t){
  if(t===PT.ans){$$('.ptpick').forEach(x=>x.disabled=true);b.classList.add('right');stat('pattern',true);
    const h=$$('.pt-cell')[PT.hole];h.classList.remove('hole','cur');h.classList.add('filled');h.innerHTML=PT.toks[t].art;sparkEl(h,18);tone('ok');bipReact('happy');
    if(PT.hi<PT.holes.length-1){PT.hi++;PT.hole=PT.holes[PT.hi];PT.ans=PT.seq[PT.hole];PT.tries=0;PT.say='Giỏi! Còn chỗ trống nữa, cái gì ở đây?';
      $$('.pt-cell')[PT.hole].classList.add('cur');setSay(PT.say);later(()=>{ptOptions();ptPlay(PT.hole)},900);return}
    later(()=>ptPlay(0,true),500);later(()=>say(`${pickOne(PRAISE())} ${PT.toks[t].name}!`),400);
    {const lv=D.lvl.pattern||0;D.lvl.pattern=PT.first?lv+1:PT.slips>=2&&lv>0?lv-1:lv}save();PT.round++;dotOn(PT.round);
    if(PT.round>=PT.rounds){const st=starsFor(PT.miss);award(st);later(()=>showDone('pattern',st,'Tìm ra quy luật rồi!'),3200)}else later(patternRound,3300);
  }else{PT.miss++;PT.slips=(PT.slips||0)+1;PT.first=false;PT.tries++;stat('pattern',false);tone('no');bipReact('sad');b.disabled=true;b.classList.add('nope');
    say(PT.tries>=2?'Nghe lại quy luật nhé!':'Chưa đúng. Nhìn lại hàng này nhé!');if(PT.tries>=2)later(()=>ptPlay(PT.hole),900)}
}
